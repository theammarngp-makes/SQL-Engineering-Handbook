<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- decorative grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- decorative NULL-lifecycle pill glyphs -->
  <g opacity="0.9">
    <rect x="840" y="38" width="130" height="34" rx="17" fill="#1e293b" stroke="#2563eb"/>
    <text x="905" y="60" font-family="Menlo, Consolas, monospace" font-size="15" fill="#60a5fa" text-anchor="middle">NULL</text>

    <rect x="990" y="38" width="150" height="34" rx="17" fill="#1e293b" stroke="#14b8a6"/>
    <text x="1065" y="60" font-family="Menlo, Consolas, monospace" font-size="14" fill="#5eead4" text-anchor="middle">COALESCE()</text>

    <rect x="870" y="150" width="140" height="34" rx="17" fill="#1e293b" stroke="#f59e0b"/>
    <text x="940" y="172" font-family="Menlo, Consolas, monospace" font-size="14" fill="#fbbf24" text-anchor="middle">TRIM()</text>

    <rect x="1025" y="150" width="150" height="34" rx="17" fill="#1e293b" stroke="#64748b"/>
    <text x="1100" y="172" font-family="Menlo, Consolas, monospace" font-size="14" fill="#cbd5e1" text-anchor="middle">VALIDATE</text>
  </g>

  <!-- Module index badge -->
  <rect x="60" y="46" width="64" height="64" rx="12" fill="url(#accent)"/>
  <text x="92" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">11</text>

  <!-- Title -->
  <text x="145" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">NULL Handling &amp; Data Cleaning</text>
  <text x="145" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">From Missing Values to Production-Grade Data Quality</text>

  <!-- footer strip -->
  <text x="60" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">SQL Engineering Handbook</text>
  <text x="1140" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="end">Beginner → Advanced · 3–3.5 hrs</text>
</svg>
