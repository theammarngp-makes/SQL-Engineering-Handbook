<svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="980" height="480" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="978" height="478" rx="13" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="980" height="54" rx="14" fill="#111826"/>
  <rect x="0" y="40" width="980" height="14" fill="#111826"/>
  <text x="28" y="35" font-size="19" font-weight="700" fill="#f0f6fc">02 — String Search &amp; Extraction</text>
  <text x="700" y="35" font-size="13" fill="#8b949e" font-family="'Cascadia Code',Consolas,monospace">position · pattern · split</text>

  <!-- Row 1: three dialect-equivalent position functions -->
  <text x="40" y="90" font-size="14" font-weight="700" fill="#7ee2b8">SAME QUESTION, THREE DIALECTS — "where is @ in the string?"</text>

  <g transform="translate(40,105)">
    <rect width="900" height="46" rx="8" fill="#0f1622" stroke="#30363d"/>
    <text x="16" y="29" font-family="'Cascadia Code',Consolas,monospace" font-size="14" fill="#f0f6fc">s = 'sofia@company.com'</text>
  </g>

  <g transform="translate(40,165)">
    <rect width="285" height="80" rx="8" fill="#101826" stroke="#30363d"/>
    <text x="16" y="26" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#58a6ff">LOCATE('@', s)</text>
    <text x="16" y="46" font-size="11.5" fill="#8b949e">MySQL-style · substring first</text>
    <text x="16" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#7ee2b8">→ 6</text>
  </g>
  <g transform="translate(348,165)">
    <rect width="285" height="80" rx="8" fill="#101826" stroke="#30363d"/>
    <text x="16" y="26" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#bc8cff">POSITION('@' IN s)</text>
    <text x="16" y="46" font-size="11.5" fill="#8b949e">ANSI-standard syntax</text>
    <text x="16" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#7ee2b8">→ 6</text>
  </g>
  <g transform="translate(656,165)">
    <rect width="285" height="80" rx="8" fill="#101826" stroke="#30363d"/>
    <text x="16" y="26" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#d29922">INSTR(s, '@')</text>
    <text x="16" y="46" font-size="11.5" fill="#8b949e">Oracle/MySQL · string first</text>
    <text x="16" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#7ee2b8">→ 6</text>
  </g>

  <!-- Row 2: LIKE vs REGEXP -->
  <text x="40" y="285" font-size="14" font-weight="700" fill="#f778ba">PATTERN MATCHING — wildcard vs. regular expression</text>

  <g transform="translate(40,300)">
    <rect width="430" height="90" rx="8" fill="#101826" stroke="#30363d"/>
    <text x="16" y="26" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#f0f6fc">email LIKE '%@gmail.com'</text>
    <text x="16" y="48" font-size="11.5" fill="#8b949e">%  = any run of characters</text>
    <text x="16" y="66" font-size="11.5" fill="#8b949e">_  = exactly one character</text>
    <text x="16" y="82" font-size="11" fill="#484f58">Leading % blocks index usage.</text>
  </g>
  <g transform="translate(510,300)">
    <rect width="430" height="90" rx="8" fill="#101826" stroke="#30363d"/>
    <text x="16" y="26" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#f0f6fc">phone REGEXP '^[0-9]{3}-'</text>
    <text x="16" y="48" font-size="11.5" fill="#8b949e">Full regex grammar — classes,</text>
    <text x="16" y="66" font-size="11.5" fill="#8b949e">anchors, quantifiers, groups.</text>
    <text x="16" y="82" font-size="11" fill="#484f58">More expressive, more costly.</text>
  </g>

  <!-- Row 3: SUBSTRING_INDEX split -->
  <text x="40" y="425" font-size="14" font-weight="700" fill="#58a6ff">SUBSTRING_INDEX — split-by-delimiter, no REGEXP needed</text>
  <g transform="translate(40,438)">
    <rect width="900" height="34" rx="8" fill="#0f1622" stroke="#30363d"/>
    <text x="16" y="23" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#f0f6fc">SUBSTRING_INDEX('sofia@company.com', '@', -1)</text>
    <text x="470" y="23" font-family="'Cascadia Code',Consolas,monospace" font-size="13" fill="#7ee2b8">→ 'company.com'</text>
  </g>
</svg>
