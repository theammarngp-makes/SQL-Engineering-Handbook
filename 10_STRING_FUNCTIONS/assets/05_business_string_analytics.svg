<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrHead2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#484f58"/>
    </marker>
    <linearGradient id="funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f1622"/>
    </linearGradient>
  </defs>
  <rect width="980" height="470" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="978" height="468" rx="13" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="980" height="54" rx="14" fill="#111826"/>
  <rect x="0" y="40" width="980" height="14" fill="#111826"/>
  <text x="28" y="35" font-size="19" font-weight="700" fill="#f0f6fc">05 — Business String Analytics</text>
  <text x="620" y="35" font-size="13" fill="#8b949e" font-family="'Cascadia Code',Consolas,monospace">synthesis of topics 01 → 04</text>

  <!-- 4 input pills -->
  <g font-family="'Cascadia Code',Consolas,monospace" font-size="12">
    <g transform="translate(50,80)">
      <rect width="205" height="34" rx="17" fill="#101826" stroke="#58a6ff"/>
      <text x="102" y="22" text-anchor="middle" fill="#58a6ff">01 · basics</text>
    </g>
    <g transform="translate(275,80)">
      <rect width="205" height="34" rx="17" fill="#101826" stroke="#bc8cff"/>
      <text x="102" y="22" text-anchor="middle" fill="#bc8cff">02 · search &amp; extract</text>
    </g>
    <g transform="translate(500,80)">
      <rect width="205" height="34" rx="17" fill="#101826" stroke="#d29922"/>
      <text x="102" y="22" text-anchor="middle" fill="#d29922">03 · transform</text>
    </g>
    <g transform="translate(725,80)">
      <rect width="205" height="34" rx="17" fill="#101826" stroke="#7ee2b8"/>
      <text x="102" y="22" text-anchor="middle" fill="#7ee2b8">04 · clean &amp; validate</text>
    </g>
  </g>

  <!-- converging lines to funnel -->
  <line x1="152" y1="114" x2="470" y2="165" stroke="#30363d" stroke-width="1.5"/>
  <line x1="377" y1="114" x2="470" y2="165" stroke="#30363d" stroke-width="1.5"/>
  <line x1="602" y1="114" x2="510" y2="165" stroke="#30363d" stroke-width="1.5"/>
  <line x1="827" y1="114" x2="510" y2="165" stroke="#30363d" stroke-width="1.5"/>

  <!-- funnel box -->
  <g transform="translate(290,168)">
    <rect width="400" height="70" rx="10" fill="url(#funnel)" stroke="#f778ba" stroke-width="1.5"/>
    <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#f778ba">business string analytics query</text>
    <text x="200" y="52" text-anchor="middle" font-size="11.5" fill="#8b949e" font-family="'Cascadia Code',Consolas,monospace">one query · four function families · one report</text>
  </g>

  <line x1="490" y1="238" x2="490" y2="262" stroke="#484f58" stroke-width="2" marker-end="url(#arrHead2)"/>

  <!-- 4 output cards -->
  <g font-family="'Segoe UI',sans-serif">
    <g transform="translate(50,268)">
      <rect width="205" height="100" rx="10" fill="#101826" stroke="#30363d"/>
      <text x="18" y="26" font-size="12.5" font-weight="700" fill="#f0f6fc">Email domain split</text>
      <text x="18" y="48" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">SUBSTRING_INDEX</text>
      <text x="18" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">(email,'@',-1)</text>
      <text x="18" y="88" font-size="10.5" fill="#7ee2b8">→ top domains report</text>
    </g>
    <g transform="translate(275,268)">
      <rect width="205" height="100" rx="10" fill="#101826" stroke="#30363d"/>
      <text x="18" y="26" font-size="12.5" font-weight="700" fill="#f0f6fc">Generated username</text>
      <text x="18" y="48" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">LOWER(LEFT(first,1))</text>
      <text x="18" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">|| CONCAT(last, id)</text>
      <text x="18" y="88" font-size="10.5" fill="#7ee2b8">→ system login IDs</text>
    </g>
    <g transform="translate(500,268)">
      <rect width="205" height="100" rx="10" fill="#101826" stroke="#30363d"/>
      <text x="18" y="26" font-size="12.5" font-weight="700" fill="#f0f6fc">Zero-padded invoice</text>
      <text x="18" y="48" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">CONCAT('INV-',</text>
      <text x="18" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">LPAD(id,6,'0'))</text>
      <text x="18" y="88" font-size="10.5" fill="#7ee2b8">→ 'INV-000042'</text>
    </g>
    <g transform="translate(725,268)">
      <rect width="205" height="100" rx="10" fill="#101826" stroke="#30363d"/>
      <text x="18" y="26" font-size="12.5" font-weight="700" fill="#f0f6fc">Malformed-record flag</text>
      <text x="18" y="48" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">CASE WHEN phone</text>
      <text x="18" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="10.5" fill="#8b949e">NOT REGEXP '^[0-9]'</text>
      <text x="18" y="88" font-size="10.5" fill="#7ee2b8">→ data-quality alert</text>
    </g>
  </g>

  <text x="40" y="405" font-size="12.5" fill="#8b949e">No new functions are introduced in this topic — only the judgment to combine 01–04 into production-grade reporting logic.</text>
  <text x="40" y="428" font-size="12.5" fill="#8b949e">Domains covered: HR · Sales · Finance · E-Commerce · Banking · Healthcare · Manufacturing · Logistics.</text>
</svg>
