<svg viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="240" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#24292e">WHERE Uses Three-Valued Logic</text>
  <text x="410" y="45" text-anchor="middle" font-size="12" fill="#586069">Only TRUE rows survive — FALSE and UNKNOWN are both dropped, silently</text>

  <g font-size="13" font-weight="700" fill="#ffffff">
    <rect x="60"  y="80" width="180" height="70" rx="10" fill="#22863a"/>
    <text x="150" y="112" text-anchor="middle">TRUE</text>
    <text x="150" y="132" text-anchor="middle" font-size="11" font-weight="400">dept_id = 1</text>

    <rect x="320" y="80" width="180" height="70" rx="10" fill="#cf222e"/>
    <text x="410" y="112" text-anchor="middle">FALSE</text>
    <text x="410" y="132" text-anchor="middle" font-size="11" font-weight="400">dept_id = 2 (when dept_id is 1)</text>

    <rect x="580" y="80" width="180" height="70" rx="10" fill="#9a6700"/>
    <text x="670" y="112" text-anchor="middle">UNKNOWN</text>
    <text x="670" y="132" text-anchor="middle" font-size="11" font-weight="400">dept_id = NULL</text>
  </g>

  <path d="M60,175 h700" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#22863a" font-weight="600">→ row kept</text>
  <text x="410" y="200" text-anchor="middle" font-size="12" fill="#cf222e" font-weight="600">→ row dropped</text>
  <text x="670" y="200" text-anchor="middle" font-size="12" fill="#9a6700" font-weight="600">→ row dropped too</text>

  <text x="410" y="228" text-anchor="middle" font-size="12" fill="#586069">
    "= NULL" always evaluates to UNKNOWN, never TRUE — that's why IS NULL exists as a dedicated test.
  </text>
</svg>
