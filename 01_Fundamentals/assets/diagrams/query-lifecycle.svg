<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#586069"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="220" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#24292e">
    From Written Query to Result Set
  </text>

  <g font-size="12" fill="#ffffff" font-weight="600">
    <rect x="20"  y="70" width="140" height="60" rx="8" fill="#586069"/>
    <text x="90" y="96" text-anchor="middle">You write</text>
    <text x="90" y="114" text-anchor="middle" font-size="11" font-weight="400">SELECT ... FROM ...</text>

    <rect x="195" y="70" width="140" height="60" rx="8" fill="#2f6feb"/>
    <text x="265" y="96" text-anchor="middle">Parser</text>
    <text x="265" y="114" text-anchor="middle" font-size="11" font-weight="400">checks syntax</text>

    <rect x="370" y="70" width="140" height="60" rx="8" fill="#6f42c1"/>
    <text x="440" y="96" text-anchor="middle">Optimizer</text>
    <text x="440" y="114" text-anchor="middle" font-size="11" font-weight="400">picks an execution plan</text>

    <rect x="545" y="70" width="150" height="60" rx="8" fill="#e8622c"/>
    <text x="620" y="96" text-anchor="middle">Execution Engine</text>
    <text x="620" y="114" text-anchor="middle" font-size="11" font-weight="400">runs FROM→WHERE→...</text>

    <rect x="730" y="70" width="150" height="60" rx="8" fill="#22863a"/>
    <text x="805" y="96" text-anchor="middle">Result Set</text>
    <text x="805" y="114" text-anchor="middle" font-size="11" font-weight="400">rows returned to you</text>
  </g>

  <g stroke="#586069" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="160" y1="100" x2="193" y2="100"/>
    <line x1="335" y1="100" x2="368" y2="100"/>
    <line x1="510" y1="100" x2="543" y2="100"/>
    <line x1="695" y1="100" x2="728" y2="100"/>
  </g>

  <text x="450" y="170" text-anchor="middle" font-size="12" fill="#586069">
    The Optimizer is why "SELECT * FROM t WHERE id = 5" and a hand-tuned index-scan version
  </text>
  <text x="450" y="188" text-anchor="middle" font-size="12" fill="#586069">
    can produce the same rows through very different amounts of work underneath.
  </text>
</svg>
