<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- decorative grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- decorative CASE/WHEN pill glyphs -->
  <g opacity="0.9">
    <rect x="860" y="40" width="120" height="34" rx="17" fill="#1e293b" stroke="#2563eb"/>
    <text x="920" y="62" font-family="Menlo, Consolas, monospace" font-size="15" fill="#60a5fa" text-anchor="middle">CASE</text>

    <rect x="1000" y="90" width="120" height="34" rx="17" fill="#1e293b" stroke="#14b8a6"/>
    <text x="1060" y="112" font-family="Menlo, Consolas, monospace" font-size="15" fill="#5eead4" text-anchor="middle">WHEN</text>

    <rect x="900" y="150" width="110" height="34" rx="17" fill="#1e293b" stroke="#f59e0b"/>
    <text x="955" y="172" font-family="Menlo, Consolas, monospace" font-size="15" fill="#fbbf24" text-anchor="middle">ELSE</text>

    <rect x="1030" y="180" width="100" height="34" rx="17" fill="#1e293b" stroke="#64748b"/>
    <text x="1080" y="202" font-family="Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1" text-anchor="middle">END</text>
  </g>

  <!-- Module index badge -->
  <rect x="60" y="46" width="64" height="64" rx="12" fill="url(#accent)"/>
  <text x="92" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">05</text>

  <!-- Title -->
  <text x="145" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f8fafc">CASE WHEN</text>
  <text x="145" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Business Logic Engineering with SQL</text>

  <!-- footer strip -->
  <text x="60" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">SQL Engineering Handbook</text>
  <text x="1140" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b" text-anchor="end">Beginner → Advanced · 2.5–3 hrs</text>
</svg>
