<svg viewBox="0 0 620 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="620" height="460" fill="#ffffff"/>
  <text x="310" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">STAR SCHEMA</text>
  <text x="310" y="54" text-anchor="middle" font-size="13" fill="#555">one large fact table, surrounded by small dimension tables</text>

  <!-- center fact table -->
  <rect x="210" y="190" width="200" height="80" rx="10" fill="#1e3a8a" stroke="#0f172a" stroke-width="2"/>
  <text x="310" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">fact_order_line_items</text>
  <text x="310" y="242" text-anchor="middle" font-size="10" fill="#dbe9ff">customer_id · product_id ·</text>
  <text x="310" y="256" text-anchor="middle" font-size="10" fill="#dbe9ff">date_id · quantity · unit_price</text>

  <!-- dim_customers (top) -->
  <rect x="220" y="60" width="180" height="60" rx="8" fill="#d6ffe3" stroke="#2e9e5b" stroke-width="2"/>
  <text x="310" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">dim_customers</text>
  <text x="310" y="104" text-anchor="middle" font-size="10" fill="#555">customer_id · name · country</text>
  <line x1="310" y1="120" x2="310" y2="188" stroke="#888" stroke-width="1.5"/>

  <!-- dim_products (left) -->
  <rect x="20" y="220" width="170" height="60" rx="8" fill="#ffe3d6" stroke="#d8763b" stroke-width="2"/>
  <text x="105" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">dim_products</text>
  <text x="105" y="264" text-anchor="middle" font-size="10" fill="#555">product_id · category</text>
  <line x1="190" y1="250" x2="208" y2="238" stroke="#888" stroke-width="1.5"/>

  <!-- dim_dates (right) -->
  <rect x="430" y="220" width="170" height="60" rx="8" fill="#fff6c9" stroke="#c8a71b" stroke-width="2"/>
  <text x="515" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">dim_dates</text>
  <text x="515" y="264" text-anchor="middle" font-size="10" fill="#555">date_id · month · quarter</text>
  <line x1="430" y1="250" x2="412" y2="238" stroke="#888" stroke-width="1.5"/>

  <!-- dim_locations (bottom, optional extension) -->
  <rect x="220" y="340" width="180" height="60" rx="8" fill="#f5e0ff" stroke="#8b3bd8" stroke-width="2"/>
  <text x="310" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">dim_locations</text>
  <text x="310" y="384" text-anchor="middle" font-size="10" fill="#555">location_id · city · country</text>
  <line x1="310" y1="270" x2="310" y2="338" stroke="#888" stroke-width="1.5"/>

  <text x="310" y="430" text-anchor="middle" font-size="12" fill="#333">Each fact→dimension join is a large table joined to a small one</text>
  <text x="310" y="448" text-anchor="middle" font-size="12" fill="#333">on an indexed surrogate key — the shape favors hash / index-nested-loop joins.</text>
</svg>
