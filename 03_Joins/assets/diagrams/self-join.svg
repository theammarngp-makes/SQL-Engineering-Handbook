<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">SELF JOIN</text>
  <text x="320" y="54" text-anchor="middle" font-size="13" fill="#555">one table, two roles — "employee" and "manager"</text>

  <!-- root: Sahil Verma, no manager -->
  <rect x="260" y="80" width="120" height="46" rx="8" fill="#dbe9ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Sahil Verma</text>
  <text x="320" y="116" text-anchor="middle" font-size="10" fill="#555">manager_id: NULL</text>

  <!-- level 2 -->
  <line x1="320" y1="126" x2="180" y2="170" stroke="#888" stroke-width="1.5"/>
  <line x1="320" y1="126" x2="460" y2="170" stroke="#888" stroke-width="1.5"/>

  <rect x="120" y="170" width="120" height="46" rx="8" fill="#ffe3d6" stroke="#d8763b" stroke-width="2"/>
  <text x="180" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Ammar Khan</text>
  <text x="180" y="206" text-anchor="middle" font-size="10" fill="#555">manager_id: 1</text>

  <rect x="400" y="170" width="120" height="46" rx="8" fill="#ffe3d6" stroke="#d8763b" stroke-width="2"/>
  <text x="460" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Riya Sharma</text>
  <text x="460" y="206" text-anchor="middle" font-size="10" fill="#555">manager_id: 1</text>

  <!-- level 3: Meera reports to Ammar -->
  <line x1="180" y1="216" x2="180" y2="260" stroke="#888" stroke-width="1.5"/>
  <rect x="120" y="260" width="120" height="46" rx="8" fill="#d6ffe3" stroke="#2e9e5b" stroke-width="2"/>
  <text x="180" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Meera Iyer</text>
  <text x="180" y="296" text-anchor="middle" font-size="10" fill="#555">manager_id: 2</text>

  <!-- explanation -->
  <text x="500" y="255" text-anchor="start" font-size="11" fill="#333">employees AS e  →  "employee" role</text>
  <text x="500" y="273" text-anchor="start" font-size="11" fill="#333">employees AS m  →  "manager" role</text>
  <text x="500" y="291" text-anchor="start" font-size="11" fill="#333">ON e.manager_id = m.emp_id</text>
</svg>
