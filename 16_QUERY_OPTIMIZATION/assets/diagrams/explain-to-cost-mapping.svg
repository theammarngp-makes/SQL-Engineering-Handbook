<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .header { fill: #f8fafc; font-size: 15px; font-weight: 700; }
      .label { fill: #94a3b8; font-size: 12px; }
      .value { fill: #f1f5f9; font-size: 13px; font-weight: 600; }
      .arrow { stroke: #f87171; stroke-width: 2; marker-end: url(#arrowhead); }
      .cost { fill: #f87171; font-size: 13px; font-weight: 700; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f87171" />
    </marker>
  </defs>
  <rect class="bg" width="900" height="420" />
  <text x="30" y="35" class="header">EXPLAIN Output → Billed Cost, By Engine</text>

  <!-- Row 1: BigQuery -->
  <rect class="card" x="30" y="60" width="260" height="70" rx="6" />
  <text x="45" y="82" class="value">BigQuery</text>
  <text x="45" y="102" class="label">totalBytesProcessed (dry run)</text>
  <line x1="290" y1="95" x2="520" y2="95" class="arrow" />
  <rect class="card" x="520" y="60" width="350" height="70" rx="6" />
  <text x="535" y="82" class="value">Bytes billed</text>
  <text x="535" y="102" class="cost">$ / TiB scanned (on-demand rate)</text>

  <!-- Row 2: Snowflake -->
  <rect class="card" x="30" y="150" width="260" height="70" rx="6" />
  <text x="45" y="172" class="value">Snowflake</text>
  <text x="45" y="192" class="label">Query Profile: bytes / partitions scanned</text>
  <line x1="290" y1="185" x2="520" y2="185" class="arrow" />
  <rect class="card" x="520" y="150" width="350" height="70" rx="6" />
  <text x="535" y="172" class="value">Credits consumed</text>
  <text x="535" y="192" class="cost">warehouse size × runtime seconds</text>

  <!-- Row 3: Redshift -->
  <rect class="card" x="30" y="240" width="260" height="70" rx="6" />
  <text x="45" y="262" class="value">Redshift</text>
  <text x="45" y="282" class="label">SVL_QUERY_METRICS scan bytes / slices</text>
  <line x1="290" y1="275" x2="520" y2="275" class="arrow" />
  <rect class="card" x="520" y="240" width="350" height="70" rx="6" />
  <text x="535" y="262" class="value">Cluster contention</text>
  <text x="535" y="282" class="cost">node-hours billed regardless; inefficiency steals shared capacity</text>

  <!-- Row 4: RDS/Aurora -->
  <rect class="card" x="30" y="330" width="260" height="70" rx="6" />
  <text x="45" y="352" class="value">RDS / Aurora</text>
  <text x="45" y="372" class="label">EXPLAIN (ANALYZE, BUFFERS): shared read</text>
  <line x1="290" y1="365" x2="520" y2="365" class="arrow" />
  <rect class="card" x="520" y="330" width="350" height="70" rx="6" />
  <text x="535" y="352" class="value">Billed I/O requests</text>
  <text x="535" y="372" class="cost">$ / million I/O ops (provisioned IOPS tiers)</text>
</svg>
