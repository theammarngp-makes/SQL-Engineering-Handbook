<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SARGable vs. Non-SARGable Predicates</text>
  <text x="400" y="46" text-anchor="middle" font-size="10" font-style="italic" fill="#94a3b8">"Seq Scan" is PostgreSQL's EXPLAIN term — MySQL reports the same full scan as type: ALL</text>

  <!-- Left: Non-SARGable -->
  <rect x="30" y="60" width="340" height="300" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="200" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">✗ Non-SARGable</text>

  <rect x="55" y="115" width="290" height="46" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="200" y="143" text-anchor="middle" font-family="monospace" font-size="12.5" fill="#7f1d1d">WHERE YEAR(hire_date) = 2023</text>

  <text x="65" y="190" font-size="11" fill="#7f1d1d">Function wraps the indexed column</text>
  <text x="65" y="208" font-size="11" fill="#7f1d1d">→ engine must compute YEAR() for</text>
  <text x="65" y="226" font-size="11" fill="#7f1d1d">   EVERY row before comparing</text>
  <text x="65" y="252" font-size="11" fill="#991b1b" font-weight="700">Result: index on hire_date is ignored</text>
  <text x="65" y="270" font-size="11" fill="#991b1b" font-weight="700">→ full table scan</text>

  <!-- small icon: scan -->
  <g transform="translate(55,290)">
    <rect x="0" y="0" width="290" height="46" rx="6" fill="#fee2e2"/>
    <text x="145" y="29" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">EXPLAIN → Seq Scan (all rows read)</text>
  </g>

  <!-- Right: SARGable -->
  <rect x="430" y="60" width="340" height="300" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="600" y="92" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">✓ SARGable</text>

  <rect x="455" y="108" width="290" height="60" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="600" y="132" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#14532d">WHERE hire_date &gt;= '2023-01-01'</text>
  <text x="600" y="150" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#14532d">  AND hire_date &lt;  '2024-01-01'</text>

  <text x="465" y="196" font-size="11" fill="#14532d">Column left bare on one side</text>
  <text x="465" y="214" font-size="11" fill="#14532d">→ engine can jump straight to the</text>
  <text x="465" y="232" font-size="11" fill="#14532d">   matching range via the index</text>
  <text x="465" y="258" font-size="11" fill="#166534" font-weight="700">Result: index on hire_date is used</text>

  <g transform="translate(455,290)">
    <rect x="0" y="0" width="290" height="46" rx="6" fill="#dcfce7"/>
    <text x="145" y="29" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">EXPLAIN → Index Range Scan</text>
  </g>
</svg>
