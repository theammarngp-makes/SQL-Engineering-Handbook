<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="800" fill="#ffffff"/>
  <text x="300" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Query Optimization Checklist</text>
  <text x="300" y="62" text-anchor="middle" font-size="11.5" fill="#64748b">Module 16 — quick reference</text>

  <!-- checklist items -->
  <g font-size="13" fill="#0f172a">
    <!-- item template: box + check + text -->
    <g transform="translate(40,100)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Ran EXPLAIN ANALYZE, not just EXPLAIN</text>
    </g>

    <g transform="translate(40,150)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Identified the single most expensive node</text>
    </g>

    <g transform="translate(40,200)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Checked every WHERE/JOIN predicate for SARGability</text>
    </g>

    <g transform="translate(40,250)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Confirmed composite index column order matches query</text>
    </g>

    <g transform="translate(40,300)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Verified join algorithm matches table-size expectations</text>
    </g>

    <g transform="translate(40,350)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Used NOT EXISTS instead of NOT IN on nullable columns</text>
    </g>

    <g transform="translate(40,400)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Replaced correlated subqueries with window functions</text>
    </g>

    <g transform="translate(40,450)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Avoided SELECT * in production queries</text>
    </g>

    <g transform="translate(40,500)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Used keyset pagination instead of large OFFSET</text>
    </g>

    <g transform="translate(40,550)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Changed one thing at a time and re-measured</text>
    </g>

    <g transform="translate(40,600)">
      <rect x="0" y="0" width="26" height="26" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="13" y="19" text-anchor="middle" font-size="15" fill="#15803d" font-weight="700">✓</text>
      <text x="42" y="18" font-weight="700">Confirmed table statistics are current, not stale</text>
    </g>
  </g>

  <rect x="40" y="670" width="520" height="90" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1"/>
  <text x="300" y="700" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Rule of thumb</text>
  <text x="300" y="722" text-anchor="middle" font-size="11" fill="#334155">Measure → Read the Plan → Hypothesize → Change One Thing → Verify</text>
  <text x="300" y="740" text-anchor="middle" font-size="10" fill="#64748b">Never guess. Never stack unproven changes.</text>
</svg>
