<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Reading an Execution Plan: Bottom-Up, Inside-Out</text>
  <text x="400" y="50" text-anchor="middle" font-size="11.5" fill="#64748b">Leaf nodes run first and feed rows upward into their parent</text>
  <text x="400" y="66" text-anchor="middle" font-size="10" font-style="italic" fill="#94a3b8">Node names shown are PostgreSQL EXPLAIN terminology — see Lesson 02 for MySQL's type/Extra equivalents</text>

  <!-- root: Sort -->
  <rect x="310" y="80" width="180" height="55" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Sort</text>
  <text x="400" y="120" text-anchor="middle" font-size="10.5" fill="#475569">cost=1400  rows=40</text>

  <!-- HashAggregate -->
  <rect x="290" y="190" width="220" height="55" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">HashAggregate</text>
  <text x="400" y="230" text-anchor="middle" font-size="10.5" fill="#475569">cost=1200  rows=40</text>

  <!-- Hash Join -->
  <rect x="270" y="300" width="260" height="55" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Hash Join</text>
  <text x="400" y="340" text-anchor="middle" font-size="10.5" fill="#475569">cost=800  rows=52,000</text>

  <!-- Seq Scan (expensive leaf, highlighted) -->
  <rect x="90" y="440" width="230" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="205" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Seq Scan: employes</text>
  <text x="205" y="483" text-anchor="middle" font-size="10.5" fill="#991b1b">cost=500  est.rows≈actual (small gap)</text>
  <text x="205" y="500" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">← most expensive node</text>

  <!-- Hash subtree -->
  <rect x="430" y="440" width="230" height="55" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="545" y="463" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Hash</text>
  <text x="545" y="480" text-anchor="middle" font-size="10.5" fill="#475569">builds hash table</text>

  <!-- Index Scan (child of Hash) -->
  <rect x="430" y="530" width="230" height="55" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="545" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Index Scan: departments</text>
  <text x="545" y="570" text-anchor="middle" font-size="10.5" fill="#166534">cost=20  cheap, indexed</text>

  <!-- connecting arrows, upward flow -->
  <line x1="400" y1="190" x2="400" y2="139" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="400" y1="300" x2="400" y2="249" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="205" y1="440" x2="330" y2="358" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="545" y1="440" x2="470" y2="358" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="545" y1="530" x2="545" y2="499" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow2)"/>
</svg>
