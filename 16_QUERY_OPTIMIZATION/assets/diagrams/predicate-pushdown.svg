<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Predicate Pushdown: WHERE Moves Below the Join</text>

  <!-- BEFORE -->
  <text x="200" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Naive logical shape</text>
  <rect x="90" y="80" width="220" height="46" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="200" y="108" text-anchor="middle" font-size="11.5" fill="#7f1d1d">WHERE dept_name = 'X'</text>
  <line x1="200" y1="126" x2="200" y2="160" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow6)"/>
  <rect x="90" y="164" width="220" height="46" rx="7" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="200" y="192" text-anchor="middle" font-size="11.5">JOIN employes ⋈ departments</text>
  <line x1="140" y1="210" x2="140" y2="244" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow6)"/>
  <line x1="260" y1="210" x2="260" y2="244" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow6)"/>
  <rect x="90" y="248" width="90" height="40" rx="6" fill="#e2e8f0"/>
  <text x="135" y="272" text-anchor="middle" font-size="10">employes</text>
  <text x="135" y="285" text-anchor="middle" font-size="9" fill="#64748b">(all rows)</text>
  <rect x="220" y="248" width="90" height="40" rx="6" fill="#e2e8f0"/>
  <text x="265" y="272" text-anchor="middle" font-size="10">departments</text>
  <text x="265" y="285" text-anchor="middle" font-size="9" fill="#64748b">(all rows)</text>
  <text x="200" y="330" text-anchor="middle" font-size="10.5" fill="#991b1b" font-weight="700">Filter applied AFTER the full join</text>
  <text x="200" y="348" text-anchor="middle" font-size="10.5" fill="#991b1b">→ join processes far more rows than needed</text>

  <!-- divider -->
  <line x1="410" y1="50" x2="410" y2="400" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- AFTER -->
  <text x="600" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Optimizer's actual physical plan</text>
  <rect x="490" y="80" width="220" height="46" rx="7" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="108" text-anchor="middle" font-size="11.5">JOIN employes ⋈ departments'</text>
  <line x1="540" y1="126" x2="540" y2="160" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow6)"/>
  <line x1="660" y1="126" x2="660" y2="160" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow6)"/>
  <rect x="490" y="164" width="90" height="40" rx="6" fill="#e2e8f0"/>
  <text x="535" y="188" text-anchor="middle" font-size="10">employes</text>
  <text x="535" y="201" text-anchor="middle" font-size="9" fill="#64748b">(all rows)</text>
  <rect x="620" y="164" width="90" height="46" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="665" y="185" text-anchor="middle" font-size="10" fill="#14532d">departments'</text>
  <text x="665" y="198" text-anchor="middle" font-size="9" fill="#166534">pre-filtered</text>
  <line x1="665" y1="245" x2="665" y2="211" stroke="#15803d" stroke-width="1.3" marker-end="url(#arrow6)"/>
  <rect x="620" y="248" width="90" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="665" y="272" text-anchor="middle" font-size="9.5" fill="#14532d">dept_name='X'</text>
  <text x="600" y="330" text-anchor="middle" font-size="10.5" fill="#166534" font-weight="700">Filter pushed BELOW the join</text>
  <text x="600" y="348" text-anchor="middle" font-size="10.5" fill="#166534">→ join's build side shrinks to a few rows</text>

  <text x="400" y="420" text-anchor="middle" font-size="11.5" fill="#334155">Same SQL text — the optimizer performs this rewrite automatically during the Optimization stage.</text>
</svg>
