<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
  </defs>
  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
    .step{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:11px;fill:#6B7280;letter-spacing:1px;}
  </style>
  <rect width="900" height="400" fill="#FAFAF7"/>
  <rect width="900" height="400" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,384 L34,384 M16,384 L16,366"/>
    <path d="M884,384 L866,384 M884,384 L884,366"/>
  </g>
  <text x="40" y="46" class="title">A Production View Stack, End to End</text>
  <text x="40" y="66" class="cap">08 — Real-World Case Studies · SaaS multi-tenant reporting, from raw events to a customer-facing metric</text>

  <text x="60" y="98" class="step">L0 · RAW</text>
  <rect x="60" y="106" width="170" height="70" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="145" y="130" class="label-sm" text-anchor="middle">usage_events</text>
  <text x="145" y="150" class="label-sm" text-anchor="middle">(billions of rows,</text>
  <text x="145" y="166" class="label-sm" text-anchor="middle">partitioned by day)</text>

  <path d="M230,141 L280,141" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="280" y="98" class="step">L1 · DAILY ROLLUP</text>
  <rect x="280" y="106" width="180" height="70" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="370" y="130" class="label-sm" text-anchor="middle" fill="#147D7A" font-weight="700">vw_daily_usage</text>
  <text x="370" y="150" class="label-sm" text-anchor="middle">GROUP BY tenant, day</text>
  <text x="370" y="166" class="label-sm" text-anchor="middle" fill="#6B7280">TEMPTABLE — expected</text>

  <path d="M460,141 L510,141" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="510" y="98" class="step">L2 · TENANT-SCOPED</text>
  <rect x="510" y="106" width="190" height="70" fill="#123A38" stroke="#147D7A" stroke-width="1.5"/>
  <text x="605" y="130" class="label-sm" text-anchor="middle" fill="#F5F3EC" font-weight="700">vw_tenant_usage</text>
  <text x="605" y="150" class="label-sm" text-anchor="middle" fill="#CFEDEA">WHERE tenant_id =</text>
  <text x="605" y="166" class="label-sm" text-anchor="middle" fill="#CFEDEA">CURRENT_TENANT()</text>

  <path d="M700,141 L750,141" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="750" y="98" class="step">L3</text>
  <rect x="750" y="106" width="100" height="70" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="800" y="136" class="label-sm" text-anchor="middle">Customer</text>
  <text x="800" y="152" class="label-sm" text-anchor="middle">API</text>

  <rect x="40" y="210" width="820" height="160" fill="#FFFFFF" stroke="#D4CFC2"/>
  <text x="60" y="234" class="label-sm" fill="#147D7A">■ Layering, not one giant View: L1 pre-aggregates the expensive part once; L2 adds tenant</text>
  <text x="60" y="252" class="label-sm">   isolation as a thin, cheap MERGE-able filter on top — mixing both concerns in one View would</text>
  <text x="60" y="270" class="label-sm">   force TEMPTABLE for every single tenant query, not just the daily rollup.</text>
  <text x="60" y="294" class="label-sm">□ CURRENT_TENANT() resolves from session context — the same View definition is safe for every</text>
  <text x="60" y="312" class="label-sm">   tenant because the isolation logic lives in the View, not scattered across application code.</text>
  <text x="60" y="336" class="label-sm">□ This is the shape a data-warehouse "gold layer" almost always takes: raw → conformed →</text>
  <text x="60" y="354" class="label-sm">   consumption — Views are how that layering is expressed inside the database itself.</text>
</svg>
