    <line x1="302" y1="231.0" x2="310" y2="231.0" stroke="#B8B2A2" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="310" y="211" width="122" height="40" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
