  <text x="40" y="46" class="title">Thirteen Shelves, One Ladder</text>
  <text x="40" y="66" class="cap">books.md · why category order beats alphabetical order</text>

  <text x="40" y="90" class="label-sm">13 categories, but one reading order — not a shelf to browse, a ladder to climb:</text>

