<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147D7A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;fill:#1A1F2B;}
    .label-xs{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
    .fn{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#147D7A;}
    .fn-amber{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#B45309;}
    .fn-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:12px;fill:#147D7A;}
  </style>

  <rect width="900" height="480" fill="#FAFAF7"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,464 L34,464 M16,464 L16,446"/>
    <path d="M884,464 L866,464 M884,464 L884,446"/>
  </g>
  <text x="40" y="46" class="title">Cadence Before Content</text>
  <text x="40" y="66" class="cap">newsletters.md · daily pulse vs. weekly digest, and why fewer wins</text>

  <text x="40" y="95" class="label-sm">Five feeds, two cadences — pick 1–2, not all five:</text>

  <line x1="70" y1="150" x2="830" y2="150" stroke="#1A1F2B" stroke-width="2"/>
  <text x="70" y="140" class="label-xs">Mon</text><text x="200" y="140" class="label-xs">Tue</text>
  <text x="330" y="140" class="label-xs">Wed</text><text x="460" y="140" class="label-xs">Thu</text>
  <text x="590" y="140" class="label-xs">Fri</text><text x="720" y="140" class="label-xs">Sat/Sun</text>

  <circle cx="70" cy="150" r="6" fill="#147D7A"/><circle cx="200" cy="150" r="6" fill="#147D7A"/>
  <circle cx="330" cy="150" r="6" fill="#147D7A"/><circle cx="460" cy="150" r="6" fill="#147D7A"/>
  <circle cx="590" cy="150" r="6" fill="#147D7A"/>
  <text x="330" y="180" class="label-sm" text-anchor="middle" style="fill:#147D7A">TLDR Data — daily pulse</text>

  <circle cx="200" cy="230" r="7" fill="#B45309"/>
  <text x="200" y="260" class="label-sm" text-anchor="middle" style="fill:#B45309">Postgres Weekly</text>
  <text x="200" y="278" class="label-xs" text-anchor="middle">weekly, Postgres-only</text>

  <circle cx="450" cy="230" r="7" fill="#B45309"/>
  <text x="450" y="260" class="label-sm" text-anchor="middle" style="fill:#B45309">Data Engineering Weekly</text>
  <text x="450" y="278" class="label-xs" text-anchor="middle">weekly, wide data-eng signal</text>

  <circle cx="700" cy="230" r="7" fill="#B45309"/>
  <text x="700" y="260" class="label-sm" text-anchor="middle" style="fill:#B45309">dbt Labs / SQLServerCentral</text>
  <text x="700" y="278" class="label-xs" text-anchor="middle">weekly, tool/dialect-specific</text>

  <rect x="40" y="360" width="820" height="70" fill="#FFFFFF" stroke="#D4CFC2"/>
  <text x="56" y="385" class="label-sm">A newsletter you delete unread is worse than no newsletter — it adds guilt</text>
  <text x="56" y="405" class="label-sm">without adding knowledge. Subscribe to one or two that match your actual stack.</text>
</svg>
