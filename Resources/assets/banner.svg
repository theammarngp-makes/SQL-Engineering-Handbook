<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#22303F" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:44px;fill:#F5F3EC;}
    .subtitle{font-family:'IBM Plex Mono',Consolas,monospace;font-size:16px;fill:#9FB2C4;}
    .tag{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12px;fill:#2DD4C7;letter-spacing:2px;}
    .spine{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;fill:#0B1420;font-weight:700;}
  </style>
  <rect width="1200" height="300" fill="#0B1420"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- bookshelf motif, right side -->
  <g>
    <!-- shelf plank -->
    <rect x="860" y="240" width="300" height="10" fill="#2DD4C7"/>
    <rect x="860" y="95" width="300" height="10" fill="#2DD4C7"/>

    <!-- book spines, varying widths/heights, all resting on bottom shelf -->
    <rect x="878" y="120" width="26" height="120" fill="#123A38" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="910" y="105" width="22" height="135" fill="#0F1B26" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="938" y="132" width="30" height="108" fill="#123A38" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="974" y="112" width="20" height="128" fill="#0F1B26" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="1000" y="140" width="26" height="100" fill="#123A38" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="1032" y="100" width="22" height="140" fill="#0F1B26" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="1060" y="124" width="28" height="116" fill="#123A38" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="1094" y="108" width="20" height="132" fill="#0F1B26" stroke="#2DD4C7" stroke-width="1.5"/>
    <rect x="1120" y="136" width="26" height="104" fill="#123A38" stroke="#2DD4C7" stroke-width="1.5"/>

    <!-- one lying-flat book resting atop two spines, as an accent -->
    <rect x="895" y="128" width="86" height="16" rx="1" fill="#2DD4C7"/>

    <!-- external link glyphs above shelf, subtle -->
    <circle cx="905" cy="70" r="9" fill="none" stroke="#2DD4C7" stroke-width="1.5"/>
    <path d="M901,70 L909,70 M905,66 L905,74" stroke="#2DD4C7" stroke-width="1.3"/>
  </g>

  <!-- corner ticks -->
  <g stroke="#3A4A5A" stroke-width="1.5">
    <path d="M24,24 L46,24 M24,24 L24,46"/>
    <path d="M1176,24 L1154,24 M1176,24 L1176,46"/>
    <path d="M24,276 L46,276 M24,276 L24,254"/>
    <path d="M1176,276 L1154,276 M1176,276 L1176,254"/>
  </g>

  <text x="60" y="90" class="tag">SQL ENGINEERING HANDBOOK · RESOURCES LIBRARY</text>
  <text x="60" y="150" class="title">Resources</text>
  <text x="60" y="184" class="subtitle">Where the modules leave off, this library picks up.</text>
  <text x="60" y="210" class="subtitle">Books · Blogs · Docs · YouTube · Interview Prep · Tools</text>
</svg>
