<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147D7A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;fill:#1A1F2B;}
    .label-xs{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
    .fn{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#147D7A;}
    .fn-amber{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#B45309;}
    .fn-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:12px;fill:#147D7A;}
  </style>

  <rect width="900" height="480" fill="#FAFAF7"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,464 L34,464 M16,464 L16,446"/>
    <path d="M884,464 L866,464 M884,464 L884,446"/>
  </g>
  <text x="40" y="46" class="title">Two Tiers of Authority</text>
  <text x="40" y="66" class="cap">blogs.md · vendor blogs vs. real-scale engineering postmortems</text>

  <rect x="90" y="110" width="720" height="120" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="110" y="138" class="fn">Tier 1 — Official &amp; Vendor Blogs</text>
  <text x="110" y="160" class="label-sm">The team that builds the database, writing about the database.</text>
  <text x="110" y="180" class="label-sm">Planet PostgreSQL · MySQL Server Blog · Snowflake Blog · BigQuery Blog · dbt Blog</text>
  <text x="110" y="205" class="label-xs" style="fill:#147D7A">closest thing to a primary source that still reads like a blog →</text>

  <line x1="450" y1="230" x2="450" y2="260" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="270" width="720" height="120" fill="#FEF3E7" stroke="#B45309" stroke-width="1.5"/>
  <text x="110" y="298" class="fn-amber">Tier 2 — Engineering Blogs</text>
  <text x="110" y="320" class="label-sm">Companies running these databases at real scale, writing about what broke and why.</text>
  <text x="110" y="340" class="label-sm">Uber Engineering · Netflix Tech Blog · Airbnb Engineering · Stripe Engineering</text>
  <text x="110" y="365" class="label-xs" style="fill:#B45309">postmortems &gt; tutorials — read for the incident, not the syntax →</text>

  <rect x="40" y="410" width="820" height="48" fill="#FFFFFF" stroke="#D4CFC2"/>
  <text x="56" y="432" class="label-sm">Both tiers outrank generic "10 SQL Tips" content — which is exactly why none made the list.</text>
</svg>
