<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147D7A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;fill:#1A1F2B;}
    .label-xs{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
    .fn{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#147D7A;}
    .fn-amber{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#B45309;}
    .fn-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:12px;fill:#147D7A;}
  </style>

  <rect width="900" height="480" fill="#FAFAF7"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,464 L34,464 M16,464 L16,446"/>
    <path d="M884,464 L866,464 M884,464 L884,446"/>
  </g>
  <text x="40" y="46" class="title">Zero Setup, Thirty Seconds</text>
  <text x="40" y="66" class="cap">playgrounds.md · four browser sandboxes for "does this actually run"</text>

  <rect x="90" y="110" width="720" height="52" fill="#1A1F2B"/>
  <text x="450" y="142" class="label" style="fill:#F5F3EC" text-anchor="middle">idea → browser tab → running query, in under 30 seconds, no local setup</text>

  <line x1="450" y1="162" x2="450" y2="192" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="200" width="165" height="60" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="172" y="224" class="fn-sm" text-anchor="middle">SQLZoo</text>
  <text x="172" y="242" class="label-xs" text-anchor="middle">guided, graded</text>

  <rect x="270" y="200" width="165" height="60" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="352" y="224" class="fn-sm" text-anchor="middle">PostgreSQL Ex.</text>
  <text x="352" y="242" class="label-xs" text-anchor="middle">realistic single schema</text>

  <rect x="450" y="200" width="165" height="60" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="532" y="224" class="fn-sm" text-anchor="middle">DB Fiddle</text>
  <text x="532" y="242" class="label-xs" text-anchor="middle">multi-engine sandbox</text>

  <rect x="630" y="200" width="180" height="60" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="720" y="224" class="fn-sm" text-anchor="middle">W3Schools Editor</text>
  <text x="720" y="242" class="label-xs" text-anchor="middle">fast lookup + test</text>

  <rect x="40" y="300" width="820" height="70" fill="#FFFFFF" stroke="#D4CFC2"/>
  <text x="56" y="325" class="label-sm">Playgrounds are for testing syntax, not learning concepts from scratch —</text>
  <text x="56" y="345" class="label-sm">pair with books.md or the Handbook's own modules for the "why."</text>
</svg>
