<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147D7A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;fill:#1A1F2B;}
    .label-xs{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
    .fn{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#147D7A;}
    .fn-amber{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#B45309;}
    .fn-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:12px;fill:#147D7A;}
  </style>

  <rect width="900" height="480" fill="#FAFAF7"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,464 L34,464 M16,464 L16,446"/>
    <path d="M884,464 L866,464 M884,464 L884,446"/>
  </g>
  <text x="40" y="46" class="title">A Signal, Not a Substitute</text>
  <text x="40" y="66" class="cap">certifications.md · five credentials, ranked by cost-to-credibility</text>

  <line x1="90" y1="130" x2="90" y2="380" stroke="#B8B2A2" stroke-width="1.5"/>

  <circle cx="90" cy="150" r="7" fill="#147D7A"/>
  <rect x="120" y="126" width="380" height="46" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="132" y="148" class="fn-sm">HackerRank SQL (Basic / Advanced)</text>
  <text x="132" y="164" class="label-xs">Free · lowest-cost credible signal, shareable on LinkedIn</text>

  <circle cx="90" cy="210" r="7" fill="#B45309"/>
  <rect x="120" y="186" width="380" height="46" fill="#FEF3E7" stroke="#B45309" stroke-width="1.5"/>
  <text x="132" y="208" class="fn-amber">Microsoft DP-900</text>
  <text x="132" y="224" class="label-xs">Paid · entry-level Azure data validation</text>

  <circle cx="90" cy="270" r="7" fill="#B45309"/>
  <rect x="120" y="246" width="380" height="46" fill="#FEF3E7" stroke="#B45309" stroke-width="1.5"/>
  <text x="132" y="268" class="fn-amber">SnowPro Core</text>
  <text x="132" y="284" class="label-xs">Paid · Snowflake-specific warehouse knowledge</text>

  <circle cx="90" cy="330" r="7" fill="#B45309"/>
  <rect x="120" y="306" width="380" height="46" fill="#FEF3E7" stroke="#B45309" stroke-width="1.5"/>
  <text x="132" y="328" class="fn-amber">Oracle SQL / dbt Analytics Eng.</text>
  <text x="132" y="344" class="label-xs">Paid · vendor- or tool-specific credential</text>

  <rect x="560" y="150" width="270" height="230" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="580" y="180" class="label" font-weight="700">What a badge is</text>
  <text x="580" y="205" class="label-sm">A fast, external signal</text>
  <text x="580" y="225" class="label-sm">of a skill that's already real.</text>
  <text x="580" y="260" class="label" font-weight="700" style="fill:#B45309">What it isn't</text>
  <text x="580" y="285" class="label-sm" style="fill:#B45309">A replacement for the</text>
  <text x="580" y="305" class="label-sm" style="fill:#B45309">portfolio in projects/.</text>
</svg>
