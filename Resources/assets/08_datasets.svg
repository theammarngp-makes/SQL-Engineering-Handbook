<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147D7A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;fill:#1A1F2B;}
    .label-xs{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
    .fn{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#147D7A;}
    .fn-amber{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#B45309;}
    .fn-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:12px;fill:#147D7A;}
  </style>

  <rect width="900" height="480" fill="#FAFAF7"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,464 L34,464 M16,464 L16,446"/>
    <path d="M884,464 L866,464 M884,464 L884,446"/>
  </g>
  <text x="40" y="46" class="title">Real Data, Not Curated Data</text>
  <text x="40" y="66" class="cap">datasets.md · five public sources beyond this repo's own datasets/</text>

  <rect x="375" y="210" width="150" height="60" fill="#1A1F2B"/>
  <text x="450" y="235" class="label" style="fill:#F5F3EC" text-anchor="middle">pick a dataset</text>
  <text x="450" y="255" class="label-xs" style="fill:#9FB2C4" text-anchor="middle">with ≥ 3 related tables</text>

  <line x1="390" y1="210" x2="200" y2="110" stroke="#147D7A" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="110" y="86" width="180" height="42" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="122" y="112" class="fn-sm">Kaggle</text>

  <line x1="440" y1="210" x2="440" y2="110" stroke="#147D7A" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="350" y="86" width="180" height="42" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="362" y="112" class="fn-sm">data.gov</text>

  <line x1="510" y1="210" x2="700" y2="110" stroke="#147D7A" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="610" y="86" width="200" height="42" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="622" y="112" class="fn-sm">UCI ML Repository</text>

  <line x1="390" y1="260" x2="200" y2="360" stroke="#147D7A" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="110" y="360" width="180" height="42" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="122" y="386" class="fn-sm">NYC Open Data</text>

  <line x1="510" y1="260" x2="700" y2="360" stroke="#147D7A" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="610" y="360" width="200" height="42" fill="#FFFFFF" stroke="#147D7A" stroke-width="1.5"/>
  <text x="622" y="386" class="fn-sm">data.gov.in</text>

  <text x="450" y="440" class="label-sm" text-anchor="middle">Single flat CSVs don't exercise joins — which is most of what real SQL work actually is.</text>
</svg>
