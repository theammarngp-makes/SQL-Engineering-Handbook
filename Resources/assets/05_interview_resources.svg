<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147D7A"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11.5px;fill:#1A1F2B;}
    .label-xs{font-family:'IBM Plex Mono',Consolas,monospace;font-size:10.5px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
    .fn{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#147D7A;}
    .fn-amber{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:13px;fill:#B45309;}
    .fn-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-weight:700;font-size:12px;fill:#147D7A;}
  </style>

  <rect width="900" height="480" fill="#FAFAF7"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,464 L34,464 M16,464 L16,446"/>
    <path d="M884,464 L866,464 M884,464 L884,446"/>
  </g>
  <text x="40" y="46" class="title">A Funnel, Not a Link Dump</text>
  <text x="40" y="66" class="cap">interview-resources.md · four stages, each narrower than the last</text>

  <g>
    <rect x="70.0" y="100" width="760" height="46" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
    <text x="450" y="120" class="label-sm" style="fill:#1A1F2B" text-anchor="middle">1. Syntax</text>
    <text x="450" y="135" class="label-sm" style="fill:#1A1F2B" text-anchor="middle">fluency</text>
    <rect x="145.0" y="160" width="610" height="46" fill="#DCEFEE" stroke="#147D7A" stroke-width="1.5"/>
    <text x="450" y="180" class="label-sm" style="fill:#1A1F2B" text-anchor="middle">2. Pattern</text>
    <text x="450" y="195" class="label-sm" style="fill:#1A1F2B" text-anchor="middle">recognition</text>
    <rect x="220.0" y="220" width="460" height="46" fill="#CFE9E7" stroke="#147D7A" stroke-width="1.5"/>
    <text x="450" y="240" class="label-sm" style="fill:#1A1F2B" text-anchor="middle">3. Communi-</text>
    <text x="450" y="255" class="label-sm" style="fill:#1A1F2B" text-anchor="middle">cation</text>
    <rect x="295.0" y="280" width="310" height="46" fill="#147D7A" stroke="#147D7A" stroke-width="1.5"/>
    <text x="450" y="300" class="label-sm" style="fill:#F5F3EC" text-anchor="middle">4. Business</text>
    <text x="450" y="315" class="label-sm" style="fill:#F5F3EC" text-anchor="middle">framing</text>

  </g>
  <rect x="40" y="345" width="820" height="100" fill="#FFFFFF" stroke="#D4CFC2"/>
  <text x="56" y="368" class="label-sm">Staged plan, not a flat link list — each level tests something specific:</text>
  <text x="56" y="390" class="label-sm">write correct joins without hesitation → spot "gaps and islands" in 30 seconds →</text>
  <text x="56" y="410" class="label-sm">narrate the approach before writing the query → connect it back to the business ask.</text>
  <text x="56" y="430" class="label-xs" style="fill:#B45309">Exit criteria: solve a fresh question, on a shared screen, out loud, in under 15 minutes.</text>
</svg>
