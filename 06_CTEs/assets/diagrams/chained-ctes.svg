<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#147D7A"/>
    </marker>
  </defs>
  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
  </style>
  <rect width="900" height="420" fill="#FAFAF7"/>
  <rect width="900" height="420" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,404 L34,404 M16,404 L16,386"/>
    <path d="M884,404 L866,404 M884,404 L884,386"/>
  </g>
  <text x="40" y="46" class="title">Chaining Multiple CTEs</text>
  <text x="40" y="66" class="cap">02 — Multiple CTEs · each block prepares one piece of logic; the final SELECT combines them</text>

  <!-- source tables -->
  <rect x="50" y="100" width="130" height="46" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="115" y="128" class="label" text-anchor="middle">employes</text>

  <rect x="50" y="180" width="130" height="46" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="115" y="208" class="label" text-anchor="middle">departments</text>

  <path d="M180,123 L250,123" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M180,203 L250,203" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- WITH block containing two ctes -->
  <rect x="250" y="80" width="220" height="90" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="360" y="102" class="label-sm" text-anchor="middle" fill="#147D7A" font-weight="700">emp_cte</text>
  <text x="360" y="122" class="label-sm" text-anchor="middle">emp_id, emp_name, dept_id</text>
  <line x1="260" y1="132" x2="460" y2="132" stroke="#147D7A" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="150" class="label-sm" text-anchor="middle">defined first, referenced later</text>

  <rect x="250" y="180" width="220" height="90" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="360" y="202" class="label-sm" text-anchor="middle" fill="#147D7A" font-weight="700">dept_cte</text>
  <text x="360" y="222" class="label-sm" text-anchor="middle">dept_id, dept_name</text>
  <line x1="260" y1="232" x2="460" y2="232" stroke="#147D7A" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="360" y="250" class="label-sm" text-anchor="middle">comma-separated, same WITH</text>

  <text x="215" y="176" class="label-sm" fill="#6B7280" transform="rotate(-90 215,176)">WITH ... , ...</text>

  <path d="M470,125 L600,180" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M470,225 L600,200" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- join -->
  <rect x="600" y="150" width="230" height="80" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="715" y="178" class="label" text-anchor="middle" font-weight="700">emp_cte e</text>
  <text x="715" y="196" class="label" text-anchor="middle">JOIN dept_cte d</text>
  <text x="715" y="214" class="label-sm" text-anchor="middle">ON e.dept_id = d.dept_id</text>

  <!-- final result -->
  <path d="M715,230 L715,270" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="270" width="230" height="46" fill="#123A38" stroke="#147D7A" stroke-width="1.5"/>
  <text x="715" y="298" class="label" text-anchor="middle" fill="#F5F3EC">emp_id · emp_name · dept_name</text>

  <rect x="40" y="340" width="820" height="60" fill="#FFFFFF" stroke="#D4CFC2"/>
  <text x="60" y="362" class="label-sm" fill="#147D7A">■ Order matters: a later CTE may reference an earlier one, never the reverse.</text>
  <text x="60" y="382" class="label-sm">□ A missing comma between CTE definitions is the single most common Multiple-CTE syntax error.</text>
</svg>
