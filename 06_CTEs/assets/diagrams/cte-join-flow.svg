<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
  </defs>
  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13px;fill:#1A1F2B;}
    .label-sm{font-family:'IBM Plex Mono',Consolas,monospace;font-size:11px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
  </style>
  <rect width="900" height="420" fill="#FAFAF7"/>
  <rect width="900" height="420" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,404 L34,404 M16,404 L16,386"/>
    <path d="M884,404 L866,404 M884,404 L884,386"/>
  </g>
  <text x="40" y="46" class="title">Three CTEs, One Join Chain</text>
  <text x="40" y="66" class="cap">03 — CTEs with Joins · emp_cte → dept_cte → locations_cte, joined into a single workforce view</text>

  <!-- three CTE columns -->
  <rect x="60" y="100" width="180" height="70" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="150" y="126" class="label" text-anchor="middle" font-weight="700" fill="#147D7A">emp_cte</text>
  <text x="150" y="146" class="label-sm" text-anchor="middle">emp_id, emp_name,</text>
  <text x="150" y="160" class="label-sm" text-anchor="middle">dept_id</text>

  <rect x="360" y="100" width="180" height="70" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="450" y="126" class="label" text-anchor="middle" font-weight="700" fill="#147D7A">dept_cte</text>
  <text x="450" y="146" class="label-sm" text-anchor="middle">dept_id, dept_name,</text>
  <text x="450" y="160" class="label-sm" text-anchor="middle">location_id</text>

  <rect x="660" y="100" width="180" height="70" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="750" y="126" class="label" text-anchor="middle" font-weight="700" fill="#147D7A">locations_cte</text>
  <text x="750" y="146" class="label-sm" text-anchor="middle">location_id, city</text>

  <!-- join keys -->
  <path d="M240,135 L360,135" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="122" class="label-sm" text-anchor="middle" fill="#6B7280">dept_id</text>

  <path d="M540,135 L660,135" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="122" class="label-sm" text-anchor="middle" fill="#6B7280">location_id</text>

  <!-- converge to final report -->
  <path d="M150,170 L440,240" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450,170 L450,240" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M750,170 L460,240" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="240" width="320" height="70" fill="#123A38" stroke="#147D7A" stroke-width="1.5"/>
  <text x="450" y="268" class="label" text-anchor="middle" fill="#F5F3EC" font-weight="700">Workforce Report</text>
  <text x="450" y="288" class="label-sm" text-anchor="middle" fill="#CFEDEA">emp_name · dept_name · city</text>

  <rect x="60" y="340" width="780" height="60" fill="#FFFFFF" stroke="#D4CFC2"/>
  <text x="80" y="362" class="label-sm" fill="#147D7A">■ Splitting one query into per-entity CTEs mirrors how the tables actually relate —</text>
  <text x="80" y="380" class="label-sm">each join key (dept_id, location_id) is easy to verify in isolation before the final SELECT runs.</text>
</svg>
