    <g font-size="22">
      <text x="34" y="70"><tspan fill="#5c6b85">-- EXPLAIN ANALYZE shows est. rows=400,000</tspan></text>
      <text x="34" y="98"><tspan fill="#5c6b85">-- actual rows=3. Query is fast. Is that a problem?</tspan></text>
      <text x="34" y="134"><tspan fill="#f2b84b" font-weight="700">-- </tspan><tspan fill="#e7ecf5">Diagnose it. Explain the mechanism. Not just the fix.</tspan></text>
