<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="700" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">SQL Competency Pyramid</text>
  <text x="400" y="54" text-anchor="middle" font-size="11.5" fill="#64748b">Each level assumes the ones below it — see TAXONOMY_AND_FORMAT.md</text>
  <rect x="330" y="80" width="140" height="46" fill="#15803d"/>
  <text x="400" y="108" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">L9 · System Design</text>
  <rect x="300" y="130" width="200" height="46" fill="#15803d"/>
  <text x="400" y="158" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">L8 · Interviewer / Hiring</text>
  <rect x="270" y="180" width="260" height="46" fill="#15803d"/>
  <text x="400" y="208" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">L7 · Senior / Staff Engineering</text>
  <rect x="240" y="230" width="320" height="46" fill="#b45309"/>
  <text x="400" y="258" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">L6 · Production Debugging</text>
  <rect x="210" y="280" width="380" height="46" fill="#b91c1c"/>
  <text x="400" y="308" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">L5 · Real-World SQL</text>
  <rect x="180" y="330" width="440" height="46" fill="#c2410c"/>
  <text x="400" y="358" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">L4 · Database Engineering</text>
  <rect x="150" y="380" width="500" height="46" fill="#a16207"/>
  <text x="400" y="408" text-anchor="middle" font-size="11.5" fill="#ffffff" font-weight="700">L3 · Advanced SQL</text>
  <rect x="120" y="430" width="560" height="46" fill="#15803d"/>
  <text x="400" y="458" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">L2 · Analytical SQL (window functions)</text>
  <rect x="90" y="480" width="620" height="46" fill="#0e7490"/>
  <text x="400" y="508" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">L1 · Core SQL (joins, aggregation, CTEs)</text>
  <rect x="60" y="530" width="680" height="50" fill="#1d4ed8"/>
  <text x="400" y="560" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">L0 · Foundations (SELECT, WHERE, ORDER BY)</text>
  <text x="400" y="615" text-anchor="middle" font-size="11" fill="#334155">Difficulty is assigned by objective criteria, not by how the syntax looks —</text>
  <text x="400" y="633" text-anchor="middle" font-size="11" fill="#334155">see the Difficulty Criteria table for exactly what separates each level.</text>
  <text x="400" y="665" text-anchor="middle" font-size="11" fill="#15803d" font-weight="700">All 10 levels (L0–L9) have built questions — 92 total.</text>
</svg>
