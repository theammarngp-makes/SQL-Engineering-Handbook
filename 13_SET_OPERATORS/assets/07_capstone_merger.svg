<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box{ fill:#eff6ff; stroke:#2563eb; stroke-width:1.5; }
      .res{ fill:#ecfdf5; stroke:#14b8a6; stroke-width:1.5; }
      .warn{ fill:#fff7ed; stroke:#f59e0b; stroke-width:1.5; }
      .neutral{ fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; }
      .lbl{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:13.5px; fill:#0f172a; font-weight:600; }
      .small{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:12px; fill:#475569; }
      .mono{ font-family:Menlo, Consolas, monospace; font-size:12px; fill:#334155; }
      .title{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:17px; fill:#0f172a; font-weight:700; }
      .arrow{ stroke:#64748b; stroke-width:1.5; marker-end:url(#ah); fill:none; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <text x="30" y="34" class="title">Capstone: GlobalMart × UrbanCart Merger Consolidation</text>

  <rect x="40" y="56" width="180" height="40" rx="8" class="neutral"/>
  <text x="130" y="81" class="mono" text-anchor="middle" font-size="12">UrbanCart CRM</text>

  <rect x="580" y="56" width="180" height="40" rx="8" class="neutral"/>
  <text x="670" y="81" class="mono" text-anchor="middle" font-size="12">GlobalMart CRM</text>

  <path d="M180,96 L340,130" class="arrow"/>
  <path d="M620,96 L460,130" class="arrow"/>

  <rect x="260" y="132" width="280" height="46" rx="8" class="warn"/>
  <text x="400" y="160" class="mono" text-anchor="middle" font-size="12">customer_id EXCEPT (both directions)</text>
  <text x="400" y="196" class="small" text-anchor="middle">→ migration gaps</text>

  <rect x="40" y="216" width="200" height="40" rx="8" class="neutral"/>
  <text x="140" y="241" class="mono" text-anchor="middle" font-size="11.5">sales_urbancart</text>

  <rect x="540" y="216" width="200" height="40" rx="8" class="neutral"/>
  <text x="640" y="241" class="mono" text-anchor="middle" font-size="11.5">sales_globalmart</text>

  <path d="M140,256 L370,286" class="arrow"/>
  <path d="M640,256 L430,286" class="arrow"/>

  <rect x="300" y="288" width="200" height="40" rx="8" class="box"/>
  <text x="400" y="313" class="mono" text-anchor="middle" font-size="12">UNION ALL → unified_sales</text>

  <rect x="40" y="336" width="720" height="34" rx="8" class="res"/>
  <text x="400" y="358" class="mono" text-anchor="middle" font-size="12">loyalty_urbancart UNION loyalty_globalmart → deduplicated campaign list</text>
</svg>
