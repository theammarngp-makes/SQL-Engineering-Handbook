<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box{ fill:#eff6ff; stroke:#2563eb; stroke-width:1.5; }
      .res{ fill:#ecfdf5; stroke:#14b8a6; stroke-width:1.5; }
      .warn{ fill:#fff7ed; stroke:#f59e0b; stroke-width:1.5; }
      .neutral{ fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; }
      .lbl{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:14px; fill:#0f172a; font-weight:600; }
      .small{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:12px; fill:#475569; }
      .mono{ font-family:Menlo, Consolas, monospace; font-size:12.5px; fill:#334155; }
      .title{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:17px; fill:#0f172a; font-weight:700; }
      .arrow{ stroke:#64748b; stroke-width:1.5; marker-end:url(#ah); fill:none; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="30" y="34" class="title">Reconciliation: Expected vs Received Shipments</text>

  <rect x="40" y="56" width="240" height="110" rx="8" class="neutral"/>
  <text x="160" y="78" class="lbl" text-anchor="middle" font-size="13">Expected Shipments</text>
  <text x="60" y="100" class="mono" font-size="12">SHIP-001</text>
  <text x="60" y="120" class="mono" font-size="12">SHIP-002</text>
  <text x="60" y="140" class="mono" font-size="12">SHIP-003</text>

  <rect x="520" y="56" width="240" height="110" rx="8" class="neutral"/>
  <text x="640" y="78" class="lbl" text-anchor="middle" font-size="13">Received Shipments</text>
  <text x="540" y="100" class="mono" font-size="12">SHIP-001</text>
  <text x="540" y="120" class="mono" font-size="12">SHIP-003 (unexpected)</text>

  <path d="M160,166 L160,206" class="arrow"/>
  <path d="M640,166 L640,206" class="arrow"/>

  <rect x="40" y="208" width="330" height="50" rx="8" class="warn"/>
  <text x="60" y="238" class="mono" font-size="12.5">EXCEPT (Expected − Received) → SHIP-002</text>

  <rect x="430" y="208" width="330" height="50" rx="8" class="res"/>
  <text x="450" y="238" class="mono" font-size="12.5">EXCEPT (Received − Expected) → { }</text>

  <line x1="30" y1="278" x2="770" y2="278" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="300" class="small">SHIP-002 never arrived — that's a real gap worth investigating. Nothing arrived that wasn't expected in this example.</text>
</svg>
