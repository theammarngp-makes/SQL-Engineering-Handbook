<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box{ fill:#eff6ff; stroke:#2563eb; stroke-width:1.5; }
      .res{ fill:#ecfdf5; stroke:#14b8a6; stroke-width:1.5; }
      .neutral{ fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; }
      .lbl{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:14px; fill:#0f172a; font-weight:600; }
      .small{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:12px; fill:#475569; }
      .mono{ font-family:Menlo, Consolas, monospace; font-size:13px; fill:#334155; }
      .title{ font-family:Segoe UI,Helvetica,Arial,sans-serif; font-size:17px; fill:#0f172a; font-weight:700; }
      .arrow{ stroke:#64748b; stroke-width:1.5; marker-end:url(#ah); fill:none; }
    </style>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="30" y="34" class="title">Business Data Integration: Fan-In with a Discriminator</text>

  <rect x="30" y="60" width="170" height="40" rx="8" class="neutral"/>
  <text x="115" y="85" class="mono" text-anchor="middle">sales_us</text>

  <rect x="30" y="115" width="170" height="40" rx="8" class="neutral"/>
  <text x="115" y="140" class="mono" text-anchor="middle">sales_emea</text>

  <rect x="30" y="170" width="170" height="40" rx="8" class="neutral"/>
  <text x="115" y="195" class="mono" text-anchor="middle">sales_apac</text>

  <path d="M200,80 L330,130" class="arrow"/>
  <path d="M200,135 L330,135" class="arrow"/>
  <path d="M200,190 L330,140" class="arrow"/>

  <rect x="335" y="105" width="150" height="60" rx="10" class="box"/>
  <text x="410" y="132" class="lbl" text-anchor="middle" font-size="13">UNION ALL</text>
  <text x="410" y="150" class="small" text-anchor="middle" font-size="11">+ literal region col</text>

  <path d="M485,135 L555,135" class="arrow"/>

  <rect x="560" y="105" width="200" height="60" rx="10" class="res"/>
  <text x="660" y="140" class="mono" text-anchor="middle">global_sales</text>

  <line x1="30" y1="230" x2="770" y2="230" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="30" y="256" class="small">This is a reporting/event context, not a deduplication one — UNION ALL almost always wins over UNION here.</text>
  <text x="30" y="278" class="small">A literal 'us' / 'emea' / 'apac' column added per branch is what makes the merged result traceable back to its source.</text>
</svg>
