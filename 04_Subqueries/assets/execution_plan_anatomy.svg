<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="480" fill="url(#bg-grad8)" stroke="#334155" stroke-width="2"/>

  <text x="500" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">ANNOTATED POSTGRESQL EXPLAIN (ANALYZE, BUFFERS) TREE</text>
  <text x="500" y="65" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Deconstructing SubPlan Nodes, Shared Buffers, Loops, and Hash Memory Allocation</text>

  <!-- Root Node -->
  <g transform="translate(60, 100)">
    <rect width="880" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="30" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#38bdf8">Hash Semi Join  (cost=12.45..45.89 rows=42 width=64) (actual time=0.082..0.315 rows=40 loops=1)</text>
    <text x="25" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">Hash Cond: (e.dept_id = d.dept_id) | Shared Hit: 14 buffers | Memory: 32kB</text>
    
    <rect x="740" y="15" width="125" height="45" rx="4" fill="#0284c7"/>
    <text x="802" y="33" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Root Operator</text>
    <text x="802" y="48" font-family="Inter, sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">Top-Level Result</text>
  </g>

  <!-- Connector Lines -->
  <path d="M 250 175 L 250 215" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 700 175 L 700 215" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Outer Branch: Seq Scan employes -->
  <g transform="translate(60, 215)">
    <rect width="420" height="110" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#818cf8">-> Seq Scan on employes e</text>
    <text x="35" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">cost=0.00..25.00 rows=50 width=64</text>
    <text x="35" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">actual time=0.012..0.085 rows=50 loops=1</text>
    <text x="35" y="92" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399">Buffers: shared hit=8</text>

    <rect x="290" y="65" width="115" height="35" rx="4" fill="#312e81"/>
    <text x="347" y="87" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">Outer Probe Table</text>
  </g>

  <!-- Inner Branch: Hash & SubPlan -->
  <g transform="translate(520, 215)">
    <rect width="420" height="110" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#34d399">-> Hash (cost=10.50..10.50 rows=10)</text>
    <text x="35" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">Buckets: 1024  Batches: 1  Memory Usage: 9kB</text>
    <text x="35" y="72" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">actual time=0.045..0.046 rows=10 loops=1</text>
    <text x="35" y="92" font-family="JetBrains Mono, monospace" font-size="11" fill="#34d399">Buffers: shared hit=6</text>

    <rect x="290" y="65" width="115" height="35" rx="4" fill="#065f46"/>
    <text x="347" y="87" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">Inner Build Table</text>
  </g>

  <path d="M 730 325 L 730 355" stroke="#34d399" stroke-width="2" fill="none"/>

  <!-- Leaf Node: Index Scan -->
  <g transform="translate(520, 355)">
    <rect width="420" height="90" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="28" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#fbbf24">-> Index Scan using idx_dept_loc on departments d</text>
    <text x="35" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">Index Cond: (location_id = 2)</text>
    <text x="35" y="70" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">cost=0.15..10.50 rows=10 actual time=0.010..0.032</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(60, 355)">
    <rect width="420" height="90" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="15" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">KEY PLAN METRICS LEGEND:</text>
    <text x="15" y="45" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">• cost=start..total: Optimizer estimated disk page &amp; CPU units</text>
    <text x="15" y="62" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">• actual time=start..total: Real runtime wall-clock milliseconds</text>
    <text x="15" y="79" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">• loops=N: Times operator executed (&gt;1 indicates Correlated SubPlan!)</text>
  </g>
</svg>
