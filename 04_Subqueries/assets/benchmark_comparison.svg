<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="450" fill="url(#bg-grad9)" stroke="#334155" stroke-width="2"/>

  <text x="500" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">SUBQUERY QUERY PERFORMANCE &amp; SCALABILITY LAB (100K TO 50M ROWS)</text>
  <text x="500" y="65" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Execution Time (ms) Comparison Across Subquery Patterns &amp; Optimizer Rewrites</text>

  <!-- Y-Axis Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4">
    <line x1="120" y1="120" x2="900" y2="120"/>
    <line x1="120" y1="190" x2="900" y2="190"/>
    <line x1="120" y1="260" x2="900" y2="260"/>
    <line x1="120" y1="330" x2="900" y2="330"/>
    <line x1="120" y1="380" x2="900" y2="380"/>
  </g>

  <!-- Y-Axis Labels -->
  <text x="105" y="125" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">100,000 ms</text>
  <text x="105" y="195" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">10,000 ms</text>
  <text x="105" y="265" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">1,000 ms</text>
  <text x="105" y="335" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">100 ms</text>
  <text x="105" y="385" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">10 ms</text>

  <!-- X-Axis Labels -->
  <text x="230" y="410" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">100K Rows</text>
  <text x="430" y="410" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">1M Rows</text>
  <text x="630" y="410" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">10M Rows</text>
  <text x="830" y="410" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1" text-anchor="middle">50M Rows</text>

  <!-- Curve 1: Correlated SubPlan O(N*M) [RED] -->
  <path d="M 230 310 Q 430 250, 630 160 T 830 110" stroke="#f43f5e" stroke-width="3" fill="none"/>
  <circle cx="230" cy="310" r="4" fill="#f43f5e"/>
  <circle cx="430" cy="250" r="4" fill="#f43f5e"/>
  <circle cx="630" cy="160" r="4" fill="#f43f5e"/>
  <circle cx="830" cy="110" r="4" fill="#f43f5e"/>

  <!-- Curve 2: Scalar Projection in SELECT [YELLOW] -->
  <path d="M 230 350 Q 430 320, 630 240 T 830 170" stroke="#fbbf24" stroke-width="3" fill="none"/>
  <circle cx="230" cy="350" r="4" fill="#fbbf24"/>
  <circle cx="430" cy="320" r="4" fill="#fbbf24"/>
  <circle cx="630" cy="240" r="4" fill="#fbbf24"/>
  <circle cx="830" cy="170" r="4" fill="#fbbf24"/>

  <!-- Curve 3: Hash Semi Join / EXISTS [GREEN] -->
  <path d="M 230 375 Q 430 365, 630 340 T 830 300" stroke="#34d399" stroke-width="3" fill="none"/>
  <circle cx="230" cy="375" r="4" fill="#34d399"/>
  <circle cx="430" cy="365" r="4" fill="#34d399"/>
  <circle cx="630" cy="340" r="4" fill="#34d399"/>
  <circle cx="830" cy="300" r="4" fill="#34d399"/>

  <!-- Legend -->
  <g transform="translate(180, 80)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#f43f5e" stroke-width="3"/>
    <text x="40" y="4" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Correlated SubPlan (Unoptimized)</text>

    <line x1="280" y1="0" x2="310" y2="0" stroke="#fbbf24" stroke-width="3"/>
    <text x="320" y="4" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Scalar Projection Subquery</text>

    <line x1="530" y1="0" x2="560" y2="0" stroke="#34d399" stroke-width="3"/>
    <text x="570" y="4" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Unnested Hash Semi/Anti Join</text>
  </g>
</svg>
