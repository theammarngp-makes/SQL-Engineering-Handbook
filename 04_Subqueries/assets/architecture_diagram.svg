<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="480" fill="url(#bg-grad14)" stroke="#334155" stroke-width="2"/>

  <text x="500" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">RELATIONAL DATABASE SUBQUERY ENGINE ARCHITECTURE</text>
  <text x="500" y="65" font-family="Inter, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Internal Processing Pipeline from SQL Text to Physical Execution Operator Tree</text>

  <!-- Box 1: SQL Parser -->
  <g transform="translate(60, 110)">
    <rect width="180" height="310" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="180" height="35" rx="8" fill="#0284c7"/>
    <text x="90" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1. SQL Parser</text>
    <text x="15" y="65" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Lexical Analysis</text>
    <text x="15" y="90" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• AST SubLink Nodes</text>
    <text x="15" y="115" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• EXPR_SUBLINK</text>
    <text x="15" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• EXISTS_SUBLINK</text>
    <text x="15" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• ANY_SUBLINK</text>
    <rect x="15" y="220" width="150" height="60" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="245" font-family="Inter, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Raw Query Tree</text>
  </g>

  <path d="M 245 265 L 285 265" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Box 2: Logical Rewriter -->
  <g transform="translate(290, 110)">
    <rect width="180" height="310" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect width="180" height="35" rx="8" fill="#4f46e5"/>
    <text x="90" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2. Logical Rewriter</text>
    <text x="15" y="65" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Subquery Unnest</text>
    <text x="15" y="90" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Pull-up Subqueries</text>
    <text x="15" y="115" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Flatten Derived</text>
    <text x="15" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Pushdown Preds</text>
    <text x="15" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Convert to Join</text>
    <rect x="15" y="220" width="150" height="60" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
    <text x="90" y="245" font-family="Inter, sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">Flattened RelAlg</text>
  </g>

  <path d="M 475 265 L 515 265" stroke="#818cf8" stroke-width="2" fill="none"/>

  <!-- Box 3: Cost Optimizer -->
  <g transform="translate(520, 110)">
    <rect width="180" height="310" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="180" height="35" rx="8" fill="#e11d48"/>
    <text x="90" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3. Cost Optimizer</text>
    <text x="15" y="65" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Selectivity MCV</text>
    <text x="15" y="90" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Cardinality Model</text>
    <text x="15" y="115" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Choose Semi Join</text>
    <text x="15" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Choose Anti Join</text>
    <text x="15" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• SubPlan vs InitPlan</text>
    <rect x="15" y="220" width="150" height="60" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
    <text x="90" y="245" font-family="Inter, sans-serif" font-size="11" fill="#f43f5e" text-anchor="middle">Physical Plan Tree</text>
  </g>

  <path d="M 705 265 L 745 265" stroke="#f43f5e" stroke-width="2" fill="none"/>

  <!-- Box 4: Execution Engine -->
  <g transform="translate(750, 110)">
    <rect width="190" height="310" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="190" height="35" rx="8" fill="#059669"/>
    <text x="95" y="23" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4. Execution Engine</text>
    <text x="15" y="65" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Hash Table Build</text>
    <text x="15" y="90" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Probe Outer Stream</text>
    <text x="15" y="115" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Early Exit Probe</text>
    <text x="15" y="140" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Shared Buffers I/O</text>
    <text x="15" y="165" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1">• Result Streaming</text>
    <rect x="15" y="220" width="160" height="60" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="95" y="245" font-family="Inter, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Tuple Execution</text>
  </g>
</svg>
