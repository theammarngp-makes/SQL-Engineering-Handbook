<svg viewBox="0 0 620 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="620" height="660" rx="16" fill="#0f172a"/>
  <text x="310" y="42" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">SQL Logical Execution Order</text>
  <text x="310" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Where WINDOW FUNCTIONS actually run in the pipeline</text>

  <!-- stages -->
  <g font-size="15" font-weight="600">
    <!-- 1 FROM/JOIN -->
    <rect x="110" y="90" width="400" height="48" rx="10" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="119" text-anchor="middle" fill="#e2e8f0">1 &#183; FROM / JOIN</text>

    <line x1="310" y1="138" x2="310" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 2 WHERE -->
    <rect x="110" y="160" width="400" height="48" rx="10" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="189" text-anchor="middle" fill="#e2e8f0">2 &#183; WHERE</text>

    <line x1="310" y1="208" x2="310" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 3 GROUP BY -->
    <rect x="110" y="230" width="400" height="48" rx="10" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="259" text-anchor="middle" fill="#e2e8f0">3 &#183; GROUP BY</text>

    <line x1="310" y1="278" x2="310" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 4 HAVING -->
    <rect x="110" y="300" width="400" height="48" rx="10" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="329" text-anchor="middle" fill="#e2e8f0">4 &#183; HAVING</text>

    <line x1="310" y1="348" x2="310" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 5 WINDOW FUNCTIONS (highlighted) -->
    <rect x="90" y="372" width="440" height="60" rx="12" fill="#9c5fff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="310" y="398" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="800">5 &#183; WINDOW FUNCTIONS</text>
    <text x="310" y="418" text-anchor="middle" fill="#1e1033" font-size="12" font-weight="600">ROW_NUMBER / RANK / LAG / SUM() OVER(...) etc.</text>

    <line x1="310" y1="432" x2="310" y2="456" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 6 SELECT -->
    <rect x="110" y="456" width="400" height="48" rx="10" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="485" text-anchor="middle" fill="#e2e8f0">6 &#183; SELECT (incl. aliases)</text>

    <line x1="310" y1="504" x2="310" y2="526" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 7 ORDER BY -->
    <rect x="110" y="526" width="400" height="48" rx="10" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="555" text-anchor="middle" fill="#e2e8f0">7 &#183; ORDER BY</text>

    <line x1="310" y1="574" x2="310" y2="596" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 8 LIMIT -->
    <rect x="110" y="596" width="400" height="48" rx="10" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5"/>
    <text x="310" y="625" text-anchor="middle" fill="#e2e8f0">8 &#183; LIMIT</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="310" y="654" text-anchor="middle" fill="#64748b" font-size="11">Window functions run AFTER WHERE / GROUP BY / HAVING &#8212; that's why a window alias can't be filtered in the same WHERE clause.</text>
</svg>
