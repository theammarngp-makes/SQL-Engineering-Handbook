<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="660" height="340" rx="16" fill="#0f172a"/>
  <text x="330" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">SUM() OVER (ORDER BY ...) &#8212; Running Total</text>
  <text x="330" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">Frame: UNBOUNDED PRECEDING &#8594; CURRENT ROW &#8212; each row adds itself to everything before it</text>

  <!-- row values -->
  <g font-size="13" font-weight="700">
    <rect x="70" y="80" width="90" height="40" rx="7" fill="#1e3a8a" stroke="#2563eb"/>
    <text x="115" y="105" text-anchor="middle" fill="#e2e8f0">+100</text>

    <rect x="185" y="80" width="90" height="40" rx="7" fill="#1e3a8a" stroke="#2563eb"/>
    <text x="230" y="105" text-anchor="middle" fill="#e2e8f0">+250</text>

    <rect x="300" y="80" width="90" height="40" rx="7" fill="#1e3a8a" stroke="#2563eb"/>
    <text x="345" y="105" text-anchor="middle" fill="#e2e8f0">+80</text>

    <rect x="415" y="80" width="90" height="40" rx="7" fill="#1e3a8a" stroke="#2563eb"/>
    <text x="460" y="105" text-anchor="middle" fill="#e2e8f0">+300</text>

    <rect x="530" y="80" width="90" height="40" rx="7" fill="#1e3a8a" stroke="#2563eb"/>
    <text x="575" y="105" text-anchor="middle" fill="#e2e8f0">+150</text>
  </g>

  <!-- bars representing cumulative growth -->
  <g>
    <rect x="115" y="260" width="26" height="20" fill="#2563eb"/>
    <rect x="230" y="220" width="26" height="60" fill="#2563eb"/>
    <rect x="345" y="205" width="26" height="75" fill="#2563eb"/>
    <rect x="460" y="150" width="26" height="130" fill="#2563eb"/>
    <rect x="575" y="120" width="26" height="160" fill="#9c5fff"/>
  </g>
  <line x1="60" y1="280" x2="620" y2="280" stroke="#334155" stroke-width="1.5"/>

  <!-- running total labels -->
  <g font-size="14" font-weight="800">
    <text x="128" y="255" text-anchor="middle" fill="#93c5fd">100</text>
    <text x="243" y="215" text-anchor="middle" fill="#93c5fd">350</text>
    <text x="358" y="200" text-anchor="middle" fill="#93c5fd">430</text>
    <text x="473" y="145" text-anchor="middle" fill="#93c5fd">730</text>
    <text x="588" y="115" text-anchor="middle" fill="#c4b5fd">880</text>
  </g>

  <text x="330" y="308" text-anchor="middle" fill="#94a3b8" font-size="12">Each bar height is the cumulative sum of every row up to and including that row.</text>
  <text x="330" y="326" text-anchor="middle" fill="#64748b" font-size="11">Add PARTITION BY to reset the running total independently per group (e.g. per customer, per account).</text>
</svg>
