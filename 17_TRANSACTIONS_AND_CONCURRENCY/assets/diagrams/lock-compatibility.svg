<svg viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="260" fill="#f8fafc"/>
  <text x="250" y="28" text-anchor="middle" font-family="monospace" font-size="16" fill="#0f172a" font-weight="bold">Lock Compatibility (InnoDB)</text>

  <rect x="20" y="50" width="130" height="40" fill="#1e293b"/>
  <text x="85" y="74" text-anchor="middle" font-family="monospace" font-size="11" fill="#f1f5f9">Held \ Requested</text>
  <rect x="150" y="50" width="160" height="40" fill="#1e293b"/>
  <text x="230" y="74" text-anchor="middle" font-family="monospace" font-size="11" fill="#f1f5f9">Shared (S)</text>
  <rect x="310" y="50" width="160" height="40" fill="#1e293b"/>
  <text x="390" y="74" text-anchor="middle" font-family="monospace" font-size="11" fill="#f1f5f9">Exclusive (X)</text>

  <rect x="20" y="90" width="130" height="50" fill="#f1f5f9" stroke="#334155"/>
  <text x="85" y="119" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a" font-weight="bold">Shared (S)</text>
  <rect x="150" y="90" width="160" height="50" fill="#dcfce7" stroke="#cbd5e1"/>
  <text x="230" y="119" text-anchor="middle" font-family="monospace" font-size="11" fill="#15803d">compatible</text>
  <rect x="310" y="90" width="160" height="50" fill="#fee2e2" stroke="#cbd5e1"/>
  <text x="390" y="119" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">blocks / waits</text>

  <rect x="20" y="140" width="130" height="50" fill="#f1f5f9" stroke="#334155"/>
  <text x="85" y="169" text-anchor="middle" font-family="monospace" font-size="12" fill="#0f172a" font-weight="bold">Exclusive (X)</text>
  <rect x="150" y="140" width="160" height="50" fill="#fee2e2" stroke="#cbd5e1"/>
  <text x="230" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">blocks / waits</text>
  <rect x="310" y="140" width="160" height="50" fill="#fee2e2" stroke="#cbd5e1"/>
  <text x="390" y="169" text-anchor="middle" font-family="monospace" font-size="11" fill="#b91c1c">blocks / waits</text>

  <text x="250" y="215" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">S = SELECT ... FOR SHARE   ·   X = UPDATE / DELETE / INSERT / SELECT ... FOR UPDATE</text>
  <text x="250" y="233" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">Locks are held until COMMIT or ROLLBACK, not until the statement finishes</text>
</svg>
