<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="280" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-family="monospace" font-size="16" fill="#0f172a" font-weight="bold">MVCC: Row Versions via the Undo Log</text>

  <!-- timeline -->
  <line x1="60" y1="140" x2="580" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="160" font-family="monospace" font-size="10" fill="#64748b">time →</text>

  <!-- version 1 -->
  <circle cx="120" cy="140" r="7" fill="#15803d"/>
  <rect x="50" y="60" width="140" height="55" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="120" y="82" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">salary = 82000</text>
  <text x="120" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#15803d">(committed v1)</text>
  <line x1="120" y1="115" x2="120" y2="140" stroke="#15803d" stroke-width="1.5"/>

  <!-- session A snapshot taken -->
  <circle cx="260" cy="140" r="7" fill="#1d4ed8"/>
  <rect x="190" y="160" width="160" height="55" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="270" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8">Session A: snapshot</text>
  <text x="270" y="198" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d4ed8">reads salary = 82000</text>
  <line x1="260" y1="140" x2="260" y2="160" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- version 2 (session B commits) -->
  <circle cx="400" cy="140" r="7" fill="#15803d"/>
  <rect x="330" y="60" width="140" height="55" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="400" y="82" text-anchor="middle" font-family="monospace" font-size="10" fill="#15803d">salary = 95000</text>
  <text x="400" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#15803d">(committed v2, Session B)</text>
  <line x1="400" y1="115" x2="400" y2="140" stroke="#15803d" stroke-width="1.5"/>

  <!-- session A reads again, still v1 via undo log -->
  <circle cx="500" cy="140" r="7" fill="#1d4ed8"/>
  <rect x="420" y="160" width="160" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="500" y="182" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8">Session A reads again</text>
  <text x="500" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="#1d4ed8">STILL 82000</text>
  <text x="500" y="214" text-anchor="middle" font-family="monospace" font-size="9" fill="#1d4ed8">(reconstructed from undo log)</text>
  <line x1="500" y1="140" x2="500" y2="160" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="260" y1="152" x2="500" y2="152" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="320" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">Plain reads never block on writer locks — they reconstruct the snapshot-consistent version instead</text>
  <text x="320" y="274" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">(salary values are illustrative)</text>
</svg>
