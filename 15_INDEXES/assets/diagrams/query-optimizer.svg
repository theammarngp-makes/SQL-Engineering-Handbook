<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E8E4D9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F2B"/>
    </marker>
  </defs>
  <style>
    .label{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;fill:#1A1F2B;}
    .title{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-weight:700;font-size:19px;fill:#1A1F2B;}
    .cap{font-family:'IBM Plex Sans',Segoe UI,sans-serif;font-size:12px;fill:#6B7280;}
  </style>
  <rect width="900" height="480" fill="#FAFAF7"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <g stroke="#B8B2A2" stroke-width="1.5">
    <path d="M16,16 L34,16 M16,16 L16,34"/>
    <path d="M884,16 L866,16 M884,16 L884,34"/>
    <path d="M16,464 L34,464 M16,464 L16,446"/>
    <path d="M884,464 L866,464 M884,464 L884,446"/>
  </g>
  <text x="40" y="46" class="title">Cost-Based Optimization Flow</text>
  <text x="40" y="66" class="cap">07 — Query Optimization with Indexes · how the optimizer picks a plan</text>

  <rect x="360" y="96" width="180" height="44" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="450" y="123" class="label" text-anchor="middle">query parsed</text>
  <path d="M450,140 L450,166" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="320" y="166" width="260" height="46" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="450" y="194" class="label" text-anchor="middle">consult table/index statistics</text>
  <path d="M450,212 L450,238" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="290" y="238" width="320" height="46" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="450" y="266" class="label" text-anchor="middle">estimate cost per candidate access path</text>

  <path d="M370,284 L230,320" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M530,284 L670,320" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="110" y="320" width="240" height="56" fill="#FDECE3" stroke="#C2410C" stroke-width="1.5"/>
  <text x="230" y="344" class="label" text-anchor="middle" fill="#C2410C">full scan</text>
  <text x="230" y="362" class="label" text-anchor="middle" fill="#C2410C" font-size="11">cost ≈ rows × scan_cost</text>

  <rect x="550" y="320" width="240" height="56" fill="#EAF6F5" stroke="#147D7A" stroke-width="1.5"/>
  <text x="670" y="344" class="label" text-anchor="middle" fill="#147D7A">index seek</text>
  <text x="670" y="362" class="label" text-anchor="middle" fill="#147D7A" font-size="11">cost ≈ log(rows) + matches × lookup_cost</text>

  <path d="M230,376 L410,406" stroke="#1A1F2B" stroke-width="1.5" fill="none"/>
  <path d="M670,376 L490,406" stroke="#1A1F2B" stroke-width="1.5" fill="none"/>
  <path d="M450,406 L450,420" stroke="#1A1F2B" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <circle cx="450" cy="406" r="4" fill="#1A1F2B"/>
  <rect x="330" y="420" width="240" height="40" fill="#FFFFFF" stroke="#1A1F2B" stroke-width="1.5"/>
  <text x="450" y="445" class="label" text-anchor="middle">pick lowest-cost estimate</text>
</svg>
