<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="250" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#24292e">
    MIN() / MAX() Work Across Numbers, Dates, and Text
  </text>

  <!-- numeric column -->
  <g>
    <rect x="30" y="55" width="200" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="130" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#2f6feb">Numeric (salary)</text>
    <text x="50" y="100" font-size="12" fill="#24292e">50000</text>
    <text x="50" y="118" font-size="12" fill="#24292e">NULL</text>
    <text x="50" y="136" font-size="12" fill="#24292e">62000</text>
    <text x="50" y="154" font-size="12" fill="#24292e">40000</text>
    <text x="50" y="180" font-size="11" font-weight="600" fill="#22863a">MIN → 40000</text>
    <text x="50" y="196" font-size="11" font-weight="600" fill="#e8622c">MAX → 62000</text>
  </g>

  <!-- date column -->
  <g>
    <rect x="260" y="55" width="200" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="360" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#6f42c1">Date (hire_date)</text>
    <text x="280" y="100" font-size="12" fill="#24292e">2019-03-01</text>
    <text x="280" y="118" font-size="12" fill="#24292e">2021-07-15</text>
    <text x="280" y="136" font-size="12" fill="#24292e">2017-11-20</text>
    <text x="280" y="154" font-size="12" fill="#24292e">2022-01-10</text>
    <text x="280" y="180" font-size="11" font-weight="600" fill="#22863a">MIN → 2017-11-20 (earliest)</text>
    <text x="280" y="196" font-size="11" font-weight="600" fill="#e8622c">MAX → 2022-01-10 (latest)</text>
  </g>

  <!-- text column -->
  <g>
    <rect x="490" y="55" width="200" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="590" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#cf222e">Text (emp_name)</text>
    <text x="510" y="100" font-size="12" fill="#24292e">Alice</text>
    <text x="510" y="118" font-size="12" fill="#24292e">bob</text>
    <text x="510" y="136" font-size="12" fill="#24292e">Carol</text>
    <text x="510" y="154" font-size="12" fill="#24292e">Zara</text>
    <text x="510" y="180" font-size="11" font-weight="600" fill="#22863a">MIN → collation-dependent</text>
    <text x="510" y="196" font-size="11" font-weight="600" fill="#e8622c">MAX → collation-dependent</text>
  </g>

  <rect x="30" y="218" width="660" height="24" rx="6" fill="#fff5e6" stroke="#e8622c" stroke-width="1"/>
  <text x="360" y="235" text-anchor="middle" font-size="11" fill="#7a4a1e">
    Text MIN/MAX ordering depends on the column's collation — MySQL vs PostgreSQL can disagree
  </text>
</svg>
