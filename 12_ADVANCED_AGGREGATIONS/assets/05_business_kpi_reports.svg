<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#484f58"/>
    </marker>
  </defs>
  <rect width="980" height="440" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="978" height="438" rx="13" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="980" height="54" rx="14" fill="#111826"/>
  <rect x="0" y="40" width="980" height="14" fill="#111826"/>
  <text x="28" y="35" font-size="19" font-weight="700" fill="#f0f6fc">05 — Business KPI Reports</text>
  <text x="670" y="35" font-size="13" fill="#8b949e" font-family="'Cascadia Code',Consolas,monospace">SaaS · MRR, churn, ARPU</text>

  <text x="40" y="86" font-size="13" font-weight="700" fill="#7ee2b8">Topics 01–04 = mechanisms. Topic 05 = composition, aimed at a named metric.</text>

  <!-- 3 KPI cards -->
  <g font-family="'Segoe UI',sans-serif">
    <g transform="translate(40,105)">
      <rect width="280" height="145" rx="10" fill="#101826" stroke="#3fb950"/>
      <text x="18" y="30" font-size="14" font-weight="700" fill="#3fb950">MRR</text>
      <text x="18" y="52" font-size="10.5" fill="#8b949e">Monthly Recurring Revenue</text>
      <text x="18" y="82" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#c9d1d9">SUM(CASE WHEN status</text>
      <text x="18" y="98" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#c9d1d9">='active' THEN mrr END)</text>
      <text x="18" y="128" font-size="10.5" fill="#484f58">built from: conditional SUM</text>
    </g>
    <g transform="translate(350,105)">
      <rect width="280" height="145" rx="10" fill="#101826" stroke="#f85149"/>
      <text x="18" y="30" font-size="14" font-weight="700" fill="#f85149">Churn Rate</text>
      <text x="18" y="52" font-size="10.5" fill="#8b949e">Cancelled ÷ Active (start)</text>
      <text x="18" y="82" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#c9d1d9">COUNT(cancelled) /</text>
      <text x="18" y="98" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#c9d1d9">COUNT(active_start)</text>
      <text x="18" y="128" font-size="10.5" fill="#484f58">built from: ratio of 2 aggregates</text>
    </g>
    <g transform="translate(660,105)">
      <rect width="280" height="145" rx="10" fill="#101826" stroke="#bc8cff"/>
      <text x="18" y="30" font-size="14" font-weight="700" fill="#bc8cff">ARPU</text>
      <text x="18" y="52" font-size="10.5" fill="#8b949e">Avg Revenue Per User</text>
      <text x="18" y="82" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#c9d1d9">SUM(revenue) /</text>
      <text x="18" y="98" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#c9d1d9">COUNT(DISTINCT user_id)</text>
      <text x="18" y="128" font-size="10.5" fill="#484f58">built from: SUM + COUNT DISTINCT</text>
    </g>
  </g>

  <text x="40" y="298" font-size="13" font-weight="700" fill="#d29922">the real skill: definitions, not syntax</text>
  <g transform="translate(40,312)">
    <rect width="900" height="90" rx="8" fill="#0f1622" stroke="#30363d"/>
    <text x="16" y="26" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#c9d1d9">"What counts as churn?" — voluntary cancellations only? downgrades to free tier?</text>
    <text x="16" y="46" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#c9d1d9">failed payments after 3 retries? Each answer changes the CASE WHEN condition —</text>
    <text x="16" y="66" font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#7ee2b8">translating a business definition precisely is the actual engineering work here.</text>
  </g>
</svg>
