<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1c2531" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)"/>
  <rect x="0" y="274" width="1200" height="6" fill="url(#accentGrad)"/>

  <!-- decorative pivot-table glyphs -->
  <g opacity="0.14" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-weight="700">
    <text x="1000" y="80" font-size="40" fill="#58a6ff">Σ</text>
    <text x="1085" y="235" font-size="60" fill="#bc8cff">Σ</text>
    <text x="70" y="235" font-size="26" fill="#3fb950">ALL</text>
  </g>

  <g transform="translate(60,58)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#101826" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="8" fill="none" stroke="url(#accentGrad)" stroke-width="2.5"/>
    <text x="40" y="26" font-size="16" font-weight="700" letter-spacing="2" fill="#8b949e" font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace">MODULE 12</text>
  </g>

  <text x="60" y="148" font-size="52" font-weight="800" fill="#f0f6fc" letter-spacing="0.3">
    Advanced Aggregations
  </text>
  <rect x="62" y="162" width="470" height="6" rx="3" fill="url(#accentGrad)"/>

  <text x="60" y="200" font-size="19" fill="#8b949e">
    Multi-column GROUP BY, conditional metrics, ROLLUP/CUBE, and executive-ready reporting.
  </text>

  <g font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="13" fill="#8b949e">
    <text x="60" y="240">SQL Engineering Handbook</text>
    <circle cx="255" cy="236" r="2.5" fill="#30363d"/>
    <text x="270" y="240">7 topics</text>
    <circle cx="345" cy="236" r="2.5" fill="#30363d"/>
    <text x="360" y="240">1 capstone</text>
    <circle cx="465" cy="236" r="2.5" fill="#30363d"/>
    <text x="480" y="240">Advanced</text>
  </g>

  <g transform="translate(790,55)">
    <rect x="0" y="0" width="350" height="170" rx="10" fill="#0f1622" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="5" fill="#f85149"/>
    <circle cx="36" cy="18" r="5" fill="#d29922"/>
    <circle cx="54" cy="18" r="5" fill="#3fb950"/>
    <g font-family="'Cascadia Code','SFMono-Regular',Consolas,monospace" font-size="12.5">
      <text x="18" y="46" fill="#8b949e">SELECT region, product,</text>
      <text x="18" y="66" fill="#58a6ff">  SUM</text>
      <text x="62" y="66" fill="#c9d1d9">(CASE WHEN status</text>
      <text x="18" y="86" fill="#c9d1d9">    ='paid' THEN amount END)</text>
      <text x="18" y="106" fill="#8b949e">FROM sales</text>
      <text x="18" y="126" fill="#bc8cff">GROUP BY</text>
      <text x="98" y="126" fill="#f0f6fc"> ROLLUP</text>
      <text x="164" y="126" fill="#c9d1d9">(region, product);</text>
      <text x="18" y="150" fill="#3fb950">-- + subtotal + grand total rows</text>
    </g>
  </g>
</svg>
